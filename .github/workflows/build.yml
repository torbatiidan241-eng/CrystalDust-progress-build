name: CrystalDust Build
on: [push]

jobs:
  build:
    runs-on: ubuntu-20.04 # Use 20.04 as it is more compatible with legacy tools
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libpng-dev gcc-arm-none-eabi

      - name: Build Compiler (agbcc)
        run: |
          cd tools/agbcc
          ./build.sh
          # Create a symbolic link so the Makefile finds it
          mkdir -p bin
          cp agbcc bin/agbcc
          cd ../..

      - name: Build Game
        run: |
          # The PATH needs to include the tools/agbcc/bin folder
          export PATH=$PATH:$(pwd)/tools/agbcc/bin
          make -j$(nproc)

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CrystalDust-ROM
          path: '*.gba'
