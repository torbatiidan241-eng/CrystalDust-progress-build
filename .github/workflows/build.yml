name: Build CrystalDust
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Configure Git
        run: |
          git config --global core.symlinks false
          git config --global core.longpaths true

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libpng-dev gcc-arm-none-eabi

      - name: Install devkitARM
        run: |
          curl -LO https://github.com/devkitPro/installer/releases/download/v2.0.0/devkitPro-pacman-linux.deb
          sudo dpkg -i devkitPro-pacman-linux.deb
          sudo dkp-pacman -S --noconfirm devkitarm-rules

      - name: Build agbcc
        run: |
          cd tools/agbcc
          ./build.sh
          ./install.sh ../

      - name: Build ROM
        run: make -j$(nproc)
        env:
          DEVKITARM: /opt/devkitpro/devkitARM
          PATH: /opt/devkitpro/devkitARM/bin:$PATH

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: crystal-dust-rom
          path: '*.gba'
