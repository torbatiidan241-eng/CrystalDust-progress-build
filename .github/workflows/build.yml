name: CrystalDust Build

on:
  push:
    branches:
      - progress

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils-arm-none-eabi gcc-arm-none-eabi libpng-dev make git

      - name: Build agbcc
        run: |
          cd tools/agbcc
          
          # 1. Ensure all files and scripts have execute permissions
          chmod -R +x .
          
          # 2. Build the core compiler
          ./build.sh
          
          # 3. Build libc and libgcc if they exist
          if [ -d "libc" ]; then cd libc && make && cd ..; fi
          if [ -d "libgcc" ]; then cd libgcc && make && cd ..; fi
          
          # 4. Finalize bin directory
          mkdir -p bin
          if [ -f "gcc/agbcc" ]; then
            cp gcc/agbcc bin/agbcc
            cp gcc/xgcc bin/xgcc
            echo "Compiler build complete."
          else
            echo "::error::agbcc binary not found in gcc/ directory."
            exit 1
          fi
          cd ../..

      - name: Build ROM
        run: |
          # Add the newly built compiler to the PATH
          export PATH=$PATH:$(pwd)/tools/agbcc/bin
          
          # Run the main Makefile
          # We define the cross-compiler variables to ensure it uses the local setup
          make CC=arm-none-eabi-gcc AR=arm-none-eabi-ar LD=arm-none-eabi-ld OBJCOPY=arm-none-eabi-objcopy -j$(nproc)

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CrystalDust-ROM
          path: '*.gba'
