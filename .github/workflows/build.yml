name: Build ROM

on:
  push:
    branches:
      - progress
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Git config
        run: git config --global core.symlinks false

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: progress

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential binutils-arm-none-eabi gcc-arm-none-eabi libpng-dev libc6-dev

      - name: Build tools
        run: |
          # Build agbcc
          rm -rf tools/agbcc
          git clone https://github.com/pret/agbcc tools/agbcc
          cd tools/agbcc && ./build.sh && cd ../..
          chmod -R +x tools/agbcc
          
          # Manually build other required tools
          make -C tools/scaninc
          make -C tools/ramscrgen
          make -C tools/gbagfx
          make -C tools/gbafix

      - name: Patch Makefile
        run: |
          # Remove tool-building logic that crashes on Linux
          sed -i '/make_tools.mk/d' Makefile

      - name: Build ROM
        run: |
          # Create build directories manually
          mkdir -p build/src build/data
          
          # Define ARM include path dynamically
          ARM_INC=$(echo /usr/lib/gcc/arm-none-eabi/*/include | cut -d' ' -f1)
          
          # Build ROM with forced ARM toolchain and explicit include paths
          make NOTRACE=1 \
               MKDIR="mkdir -p" \
               TOOLCHAIN_PREFIX=arm-none-eabi- \
               CC="arm-none-eabi-gcc -I$ARM_INC" \
               CPP="arm-none-eabi-cpp -I$ARM_INC" \
               AS=arm-none-eabi-as \
               AR=arm-none-eabi-ar \
               LD=arm-none-eabi-ld \
               OBJCOPY=arm-none-eabi-objcopy

      - name: Upload ROM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: crystal-dust-rom
          path: "*.gba"
