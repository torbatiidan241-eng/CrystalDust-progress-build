name: CrystalDust Build

on:
  push:
    branches:
      - progress

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Initialize Submodules
        run: |
          # This ensures the 'libagbsyscall' and other dependencies are fully pulled
          git submodule sync --recursive
          git submodule update --init --recursive

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils-arm-none-eabi gcc-arm-none-eabi libpng-dev make git

      - name: Build Toolchain and Utilities
        run: |
          # 1. Build the GBA-specific compiler (agbcc)
          cd tools/agbcc
          chmod -R +x .
          ./build.sh
          [ -d "libc" ] && cd libc && make && cd ..
          [ -d "libgcc" ] && cd libgcc && make && cd ..
          cd ../..
          
          # 2. Build all individual tools found in tools/ directory
          # This handles the fact that each tool is its own sub-project
          find tools -mindepth 2 -name "Makefile" -exec dirname {} \; | while read dir; do
            echo "Building tool in $dir..."
            make -C "$dir"
          done

      - name: Build ROM
        run: |
          # Create workspace
          mkdir -p build/emerald
          
          # Add the local agbcc to PATH
          export PATH=$(pwd)/tools/agbcc/bin:$PATH
          
          # Point the compiler to the correct GBA headers
          # This resolves the 'fatal error: stddef.h: No such file or directory'
          export CFLAGS="-I$(pwd)/tools/agbcc/include"
          
          # Build the main project using all available CPU cores
          make -j$(nproc)

      - name: Upload ROM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CrystalDust-ROM
          path: '*.gba'
