name: CrystalDust Build

on:
  push:
    branches: [ progress ]
  pull_request:
    branches: [ progress ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-9 g++-9 gcc-arm-none-eabi binutils-arm-none-eabi libpng-dev make git

      - name: Build Toolchain
        run: |
          cd tools/agbcc
          chmod -R +x .
          
          # 1. Build agbcc (Host Tool)
          # We keep flags clean to avoid breaking the ./configure test
          export CC=/usr/bin/gcc-9
          export CXX=/usr/bin/g++-9
          export CFLAGS="-std=gnu89 -w -fno-strict-aliasing -fno-builtin -Wno-format-security -fcommon"
          ./build.sh
          
          # 2. Setup Library Build Environment
          # Patch Makefiles to force ARM7 assembler compatibility for libraries
          find . -name "Makefile" -exec grep -l "libgcc1" {} + | xargs -r sed -i 's|$(AS)|arm-none-eabi-as -mcpu=arm7tdmi|g'
          
          mkdir -p ../shim
          echo '#!/bin/sh' > ../shim/agbcc
          echo 'exec '"$(pwd)"'/bin/agbcc "$@"' >> ../shim/agbcc
          chmod +x ../shim/agbcc
          
          export PATH=$(pwd)/../shim:$PATH
          export TARGET_CFLAGS="-mcpu=arm7tdmi -mthumb-interwork"
          
          # 3. Build Libraries
          [ -d "libc" ] && cd libc && make -j$(nproc) CFLAGS="$TARGET_CFLAGS" && cd ..
          [ -d "libgcc" ] && cd libgcc && make -j$(nproc) CFLAGS="$TARGET_CFLAGS" && cd ..
          cd ../..
          
          # 4. Build Host Utilities (preproc, etc.)
          # Clean environment to prevent cross-compiler leakage
          unset AS CC CXX AR CFLAGS
          
          find tools -mindepth 2 -name "Makefile" -exec dirname {} \; | while read dir; do
            if [ "$dir" != "tools/agbcc" ]; then
              make -C "$dir" CC=/usr/bin/gcc CXX=/usr/bin/g++ AS=/usr/bin/as AR=/usr/bin/ar CFLAGS="-std=gnu11 -O2 -Wall"
            fi
          done

      - name: Build ROM
        run: |
          export PATH=$(pwd)/tools/agbcc/bin:$PATH
          export AGBCC=$(pwd)/tools/agbcc/bin/agbcc
          make -j$(nproc)

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CrystalDust-ROM
          path: '*.gba'
