name: Build CrystalDust
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare Runner Environment
        run: |
          git config --global core.symlinks false
          git config --global core.longpaths true

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libpng-dev gcc-arm-none-eabi make bison flex texinfo g++

      - name: Build Project Tools
        run: |
          chmod -R +x tools/agbcc
          cd tools/agbcc
          
          # Build
          export CFLAGS="-w -O2 -D_FORTIFY_SOURCE=0 -Wno-builtin-declaration-mismatch -Wno-error"
          cd gcc
          make clean
          make CFLAGS="$CFLAGS"
          
          # DEBUG: Let's see exactly what is in this folder
          echo "--- Files in $(pwd) after make: ---"
          ls -l
          
          # Force copy whatever is the newest executable
          mkdir -p ../gcc_arm
          
          # Find the largest file that is executable and copy it
          find . -maxdepth 1 -type f -executable -printf "%s %p\n" | sort -n | tail -n 1
          
          # Copy the binary found by find
          cp $(find . -maxdepth 1 -type f -executable -name "agbcc" -o -name "agbcc.exe" | head -n 1) ../gcc_arm/cc1
          
          cd ..
          ./install.sh ../
          cd ../..
          
          make tools
          chmod +x tools/agbcc/bin/agbcc tools/gbagfx/gbagfx tools/scaninc/scaninc tools/ramscrgen/ramscrgen

      - name: Build ROM
        run: |
          mkdir -p build/emerald
          make
        env:
          PATH: /usr/bin:/bin:/usr/local/bin:${{ github.workspace }}/tools/agbcc/bin:${{ github.workspace }}/tools/gbagfx:${{ github.workspace }}/tools/scaninc:${{ github.workspace }}/tools/ramscrgen:${{ github.workspace }}/tools/bin2c:${{ github.workspace }}/tools/gbafix:$PATH

      - name: Upload ROM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: crystal-dust-rom
          path: '*.gba'
