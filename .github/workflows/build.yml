name: CrystalDust Build

on:
  push:
    branches:
      - progress

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils-arm-none-eabi gcc-arm-none-eabi libpng-dev make git

      - name: Build Toolchain
        run: |
          # 1. Build agbcc
          cd tools/agbcc
          chmod -R +x .
          ./build.sh
          [ -d "libc" ] && cd libc && make && cd ..
          [ -d "libgcc" ] && cd libgcc && make && cd ..
          cd ../..
          
          # 2. Build individual tools
          # This loop finds every subdirectory that contains a Makefile and builds it.
          # Based on your screenshots, this will correctly build aif2pcm, bin2c, gbafix, gbagfx, etc.
          for dir in tools/*/; do
            if [ -f "${dir}Makefile" ]; then
              echo "Building tool in $dir"
              make -C "$dir"
            fi
          done

      - name: Build ROM
        run: |
          # Ensure build directory exists
          mkdir -p build/emerald
          
          # Add local agbcc to path
          export PATH=$(pwd)/tools/agbcc/bin:$PATH
          
          # Resolve missing <stddef.h> and <string.h> errors
          TOOLCHAIN_INC=$(arm-none-eabi-gcc -print-file-name=include)
          export CFLAGS="-I$TOOLCHAIN_INC"
          
          # Build the main project
          make -j$(nproc)

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CrystalDust-ROM
          path: '*.gba'
