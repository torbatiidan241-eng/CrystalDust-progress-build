name: CrystalDust Build

on:
  push:
    branches:
      - progress

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils-arm-none-eabi gcc-arm-none-eabi libpng-dev make git

      - name: Build Toolchain
        run: |
          # 1. Build agbcc
          cd tools/agbcc
          chmod -R +x .
          ./build.sh
          [ -d "libc" ] && cd libc && make && cd ..
          [ -d "libgcc" ] && cd libgcc && make && cd ..
          cd ../..
          
          # 2. Build ramscrgen (Required for .ld files)
          cd tools/ramscrgen
          make
          cd ../..

      - name: Build ROM
        run: |
          # Ensure build directory exists
          mkdir -p build
          
          # Set up paths
          export PATH=$PATH:$(pwd)/tools/agbcc/bin
          
          # Find the include path for the cross-compiler
          # This resolves the 'stddef.h' error by pointing to the toolchain's internal headers
          ARM_INC=$(arm-none-eabi-gcc -print-file-name=include)
          
          # Build with explicit paths
          make CC=arm-none-eabi-gcc \
               AR=arm-none-eabi-ar \
               LD=arm-none-eabi-ld \
               OBJCOPY=arm-none-eabi-objcopy \
               CFLAGS="-I$ARM_INC" \
               -j$(nproc)

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CrystalDust-ROM
          path: '*.gba'
