name: Build CrystalDust

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Manual Checkout
        run: |
          git init
          git config core.sparseCheckout true
          echo "/*" > .git/info/sparse-checkout
          echo "!/tools/agbcc" >> .git/info/sparse-checkout
          git remote add origin https://github.com/${{ github.repository }}
          git fetch --depth 1 origin progress
          git checkout progress

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-arm-none-eabi libpng-dev

      - name: Prepare Environment
        run: |
          # Create build directories
          mkdir -p build/emerald/src
          mkdir -p build/src
          
          # Create the Hijack Script to redirect agbcc -> arm-none-eabi-gcc
          mkdir -p tools/agbcc/bin
          cat << 'EOF' > tools/agbcc/bin/agbcc
          #!/bin/bash
          # Filter incompatible flags
          filtered_args=()
          for arg in "$@"; do
            if [[ "$arg" != "-mthumb-interwork" && "$arg" != "-fno-inline" ]]; then
              filtered_args+=("$arg")
            fi
          done
          arm-none-eabi-gcc "${filtered_args[@]}"
          EOF
          chmod +x tools/agbcc/bin/agbcc
          
          # Build local tools
          make tools
          chmod +x tools/gbagfx/gbagfx tools/scaninc/scaninc tools/ramscrgen/ramscrgen

      - name: Build ROM
        run: |
          # Build using the hijack script, skipping broken targets
          make rom \
               COMPARE=0 \
               berry_fix=true \
               payload=true \
               libagbsyscall=true \
               -j1
        env:
          PATH: /usr/bin:${{ github.workspace }}/tools/agbcc/bin:${{ github.workspace }}/tools/gbagfx:${{ github.workspace }}/tools/scaninc:${{ github.workspace }}/tools/ramscrgen:$PATH

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: crystal-dust-rom
          path: '*.gba'
