name: CrystalDust Build (Fresh Toolchain)

on:
  push:
    branches: [ progress ]
  pull_request:
    branches: [ progress ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-arm-none-eabi binutils-arm-none-eabi libpng-dev

      - name: Fresh Toolchain Re-installation
        run: |
          # 1. Delete the problematic folder
          rm -rf tools/agbcc
          
          # 2. Force Git to re-pull the submodule in a clean state
          git submodule update --init --force tools/agbcc
          
          # 3. Apply execute permissions recursively to the new files
          find tools/agbcc -type f -exec chmod +x {} +
          
          # 4. Build from scratch
          cd tools/agbcc
          ./build.sh
          
          # 5. Prepare bin directory
          mkdir -p bin
          cp agbcc bin/agbcc
          cd ../..

      - name: Build ROM
        run: |
          export AGBCC=$(pwd)/tools/agbcc/bin/agbcc
          export PATH=$(pwd)/tools/agbcc/bin:$PATH
          
          # Run make with forced compiler variable
          make -j$(nproc) CC="$AGBCC"
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CrystalDust-ROM
          path: '*.gba'
# Triggering a new build
