name: Build ROM

on:
  push:
    branches:
      - progress
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Git config
        run: git config --global core.symlinks false

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: progress

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential binutils-arm-none-eabi gcc-arm-none-eabi libpng-dev libc6-dev

      - name: Build tools
        run: |
          # Build agbcc
          rm -rf tools/agbcc
          git clone https://github.com/pret/agbcc tools/agbcc
          cd tools/agbcc && ./build.sh && mkdir -p bin && cp agbcc bin/ && cd ../..
          
          # Build other required tools and place them in their expected subdirectories
          for tool in scaninc preproc ramscrgen gbagfx gbafix; do
              make -C tools/$tool
              mkdir -p tools/$tool
              cp tools/$tool/$tool tools/$tool/ || true
          done

      - name: Build ROM
        run: |
          # Create build directories manually
          mkdir -p build/src build/data
          
          # Define ARM include path
          ARM_INC=$(echo /usr/lib/gcc/arm-none-eabi/*/include | cut -d' ' -f1)
          
          # Add tools to path for the build
          export PATH=$(pwd)/tools/agbcc/bin:$(pwd)/tools/preproc:$(pwd)/tools/scaninc:$PATH
          
          # Execute build with forced ARM toolchain
          # We define MKDIR to a dummy command to prevent 'missing operand' crashes
          make TOOLCHAIN_PREFIX=arm-none-eabi- \
               MKDIR="mkdir -p" \
               CC="arm-none-eabi-gcc -I$ARM_INC" \
               CPP="arm-none-eabi-cpp -I$ARM_INC" \
               AS=arm-none-eabi-as \
               AR=arm-none-eabi-ar \
               LD=arm-none-eabi-ld \
               OBJCOPY=arm-none-eabi-objcopy

      - name: Upload ROM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: crystal-dust-rom
          path: "*.gba"
