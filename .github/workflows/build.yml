- name: Build ROM
        run: |
          mkdir -p build/src build/data
          
          # 1. Define the full path to the tools
          export TOOLS_DIR=$(pwd)/tools
          export PATH="$TOOLS_DIR/agbcc/bin:$TOOLS_DIR/preproc:$TOOLS_DIR/scaninc:$PATH"
          
          # 2. Verify agbcc is accessible
          echo "Checking for agbcc:"
          which agbcc || echo "agbcc not found in PATH"
          
          # 3. Create necessary dummy headers
          echo "#define NULL ((void*)0)" > include/stddef.h
          echo "typedef unsigned char uint8_t; typedef unsigned short uint16_t; typedef unsigned int uint32_t;" > include/stdint.h
          
          # 4. Create force_types.h
          cat <<EOF > include/force_types.h
          #ifndef FORCE_TYPES_H
          #define FORCE_TYPES_H
          typedef unsigned int u32;
          typedef int s32;
          typedef volatile unsigned int vu32;
          typedef volatile int vs32;
          #define u64 u32
          #define s64 s32
          #define vu64 vu32
          #define vs64 vs32
          #endif
          EOF
          
          # 5. Build with absolute path reference if needed
          make TOOLCHAIN_PREFIX=arm-none-eabi- \
               CC="agbcc -include force_types.h" \
               CPP="agbcc -E" \
               AS=arm-none-eabi-as \
               AR=arm-none-eabi-ar \
               LD=arm-none-eabi-ld \
               OBJCOPY=arm-none-eabi-objcopy
