name: CrystalDust Build

on:
  push:
    branches: [ progress ]
  pull_request:
    branches: [ progress ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Dependencies
        run: |
          sudo apt-get update
          # Ensure we have the basic build-essential for toolchain compilation
          sudo apt-get install -y build-essential gcc-arm-none-eabi binutils-arm-none-eabi libpng-dev

      - name: Build and Verify Toolchain
        run: |
          # 1. Build agbcc
          cd tools/agbcc
          # The 'build.sh' in the toolchain directory should handle everything
          # We use a subshell to ensure we don't pollute the main environment
          bash build.sh
          
          # 2. Critical verification: Test that it's the right binary
          # This should output something like 'agbcc (GCC) 2.95.3'
          ./agbcc --version || echo "Warning: agbcc version check failed"
          
          # 3. Create the bin directory for the compiler
          mkdir -p bin
          cp agbcc bin/agbcc
          cd ../..

      - name: Build ROM
        run: |
          # 4. Point CC to our verified toolchain binary
          export AGBCC=$(pwd)/tools/agbcc/bin/agbcc
          export PATH=$(pwd)/tools/agbcc/bin:$PATH
          
          # 5. Build with the compiler explicitly defined
          # If this still fails with 'Invalid option', it means the tools/agbcc
          # directory in your repo is not the correct source code.
          make -j$(nproc) CC="$AGBCC"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CrystalDust-ROM
          path: '*.gba'
