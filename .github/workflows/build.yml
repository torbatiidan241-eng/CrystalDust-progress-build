name: Build CrystalDust

on:
  push:
    branches: [ "progrees" ]
  pull_request:
    branches: [ "progrees" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: progrees

      - name: Install Host Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libpng-dev pkg-config git curl bzip2

      - name: Download and Setup ARM GCC 10 (Compatible Toolchain)
        run: |
          curl -L -o gcc-arm-none-eabi.tar.bz2 https://developer.arm.com/-/media/Files/downloads/gnu-rm/10.3-2021.10/gcc-arm-none-eabi-10.3-2021.10-x86_64-linux.tar.bz2
          tar -xf gcc-arm-none-eabi.tar.bz2
          echo "$PWD/gcc-arm-none-eabi-10.3-2021.10/bin" >> $GITHUB_PATH

      - name: Build Modern ROM
        run: |
          arm-none-eabi-gcc --version
          make modern -j$(nproc)
