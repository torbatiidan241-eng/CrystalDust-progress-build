name: CrystalDust Build

on:
  push:
    branches: [ progress ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi libpng-dev make git

      - name: Build Toolchain
        run: |
          cd tools/agbcc
          chmod -R +x .
          ./build.sh
          # Build libs
          [ -d "libc" ] && cd libc && make && cd ..
          [ -d "libgcc" ] && cd libgcc && make && cd ..
          cd ../..
          # Build other tools
          find tools -mindepth 2 -name "Makefile" -exec make -C {} \;

      - name: Build ROM
        run: |
          # Define compiler explicitly
          export PATH=$(pwd)/tools/agbcc:$(pwd)/tools/agbcc/bin:$PATH
          export AGBCC=$(pwd)/tools/agbcc/bin/agbcc
          export AGAR=$(pwd)/tools/agbcc/bin/agag
          
          # Force submodules just in case
          git submodule update --init --recursive
          
          # Build
          make

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CrystalDust-ROM
          path: '*.gba'
