name: Build
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Configure Git
        run: |
          git config --global core.symlinks false
          git config --global core.longpaths true

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Dependencies
        run: |
          sudo apt-get update
          # Explicitly installing individual packages to ensure availability
          sudo apt-get install -y build-essential libpng-dev gcc-arm-none-eabi make binutils

      - name: Debug Environment
        run: |
          which make
          make --version
          ls -l /usr/bin/make

      - name: Build Tools
        run: |
          # Build every tool individually to ensure they exist
          cd tools/agbcc && ./build.sh && ./install.sh ../
          cd ../gbagfx && make
          cd ../scaninc && make
          cd ../ramscrgen && make
          cd ../bin2c && make
          cd ../gbafix && make
          cd ../aif2pcm && make

      - name: Build ROM
        run: make
        env:
          # Tell the makefile exactly where the tools are
          PATH: ${{ github.workspace }}/tools/agbcc/bin:${{ github.workspace }}/tools/gbagfx:${{ github.workspace }}/tools/scaninc:${{ github.workspace }}/tools/ramscrgen:${{ github.workspace }}/tools/bin2c:${{ github.workspace }}/tools/gbafix:${{ github.workspace }}/tools/aif2pcm:$PATH
      - name: Build ROM
        run: make
        env:
          # Use the absolute path to ensure make finds everything
          PATH: /usr/bin:/bin:/usr/local/bin:$PATH

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: crystal-dust-rom
          path: '*.gba'
