name: CrystalDust Build

on:
  push:
    branches:
      - progress

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Initialize Submodules
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils-arm-none-eabi gcc-arm-none-eabi libpng-dev make git

      - name: Build Toolchain and Utilities
        run: |
          # 1. Build agbcc (The GBA-specific compiler)
          cd tools/agbcc
          chmod -R +x .
          ./build.sh
          [ -d "libc" ] && cd libc && make && cd ..
          [ -d "libgcc" ] && cd libgcc && make && cd ..
          cd ../..
          
          # 2. Build all individual tools found in tools/ directory
          find tools -maxdepth 2 -name "Makefile" -exec dirname {} \; | while read dir; do
            echo "Building tool in $dir..."
            make -C "$dir"
          done

      - name: Build ROM
        run: |
          # Setup workspace
          mkdir -p build/emerald
          
          # Add local agbcc to path
          export PATH=$(pwd)/tools/agbcc/bin:$PATH
          
          # Set headers to the toolchain's internal include path
          # This resolves fatal error: stddef.h/string.h
          export CFLAGS="-I$(arm-none-eabi-gcc -print-file-name=include)"
          
          # Build main ROM
          make -j$(nproc)

      - name: Upload ROM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CrystalDust-ROM
          path: '*.gba'
