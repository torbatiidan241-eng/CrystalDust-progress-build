name: CrystalDust Build

on:
  push:
    branches:
      - progress

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils-arm-none-eabi gcc-arm-none-eabi libpng-dev make git

      - name: Build Toolchain
        run: |
          # 1. Build agbcc
          cd tools/agbcc
          chmod -R +x .
          ./build.sh
          [ -d "libc" ] && cd libc && make && cd ..
          [ -d "libgcc" ] && cd libgcc && make && cd ..
          cd ../..
          
          # 2. Build project utilities (ramscrgen, gbagfx, etc.)
          # Iterate through tools to handle individual Makefiles
          for dir in tools/*/; do
            if [ -f "${dir}Makefile" ]; then
              make -C "$dir"
            fi
          done

      - name: Build ROM
        run: |
          # Ensure workspace structure
          mkdir -p build/emerald
          
          # Setup paths for custom agbcc
          export PATH=$PATH:$(pwd)/tools/agbcc/bin
          
          # Set cross-compiler and header path
          # Dynamically locate the system headers for the cross-compiler
          SYSROOT=$(arm-none-eabi-gcc -print-sysroot)
          export CFLAGS="-I$SYSROOT/usr/include"
          
          # Execute main build
          # Use -j to utilize multi-core performance
          make -j$(nproc)

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CrystalDust-ROM
          path: '*.gba'
