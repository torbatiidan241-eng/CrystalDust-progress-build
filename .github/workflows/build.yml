name: Build CrystalDust

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Configure Git
        run: |
          git config --global core.symlinks false
          git config --global core.longpaths true

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: false # Disable default checkout to avoid race conditions
          fetch-depth: 0
          ref: progress

      - name: Force Submodule Sync
        run: |
          # Manually initialize and update submodules
          git submodule sync --recursive
          git submodule update --init --recursive --force

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential binutils-arm-none-eabi libpng-dev

      - name: Build Tools
        run: |
          # Build tools first
          make tools
          
          # Create dummy agbcc to satisfy the build system
          mkdir -p tools/agbcc/bin
          touch tools/agbcc/bin/agbcc
          chmod +x tools/agbcc/bin/agbcc

      - name: Build ROM
        run: |
          # Build ROM with explicit path to system compilers
          make COMPARE=0 -j$(nproc)
        env:
          PATH: /usr/bin:${{ github.workspace }}/tools/gbagfx:${{ github.workspace }}/tools/scaninc:${{ github.workspace }}/tools/ramscrgen:$PATH

      - name: Upload ROM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: crystal-dust-rom
          path: '*.gba'
