name: CrystalDust Build

on:
  push:
    branches: [ progress ]
  pull_request:
    branches: [ progress ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Inject flags globally to ensure the Makefile picks them up
      CFLAGS: "-std=gnu89 -w -fno-strict-aliasing -fno-builtin -Wno-format-security -Wno-error=implicit-function-declaration"
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi libpng-dev make git

      - name: Build Toolchain
        run: |
          cd tools/agbcc
          chmod -R +x .
          
          # Force the use of our environment flags
          export CFLAGS="$CFLAGS"
          ./build.sh
          
          [ -d "libc" ] && cd libc && make CFLAGS="$CFLAGS" && cd ..
          [ -d "libgcc" ] && cd libgcc && make CFLAGS="$CFLAGS" && cd ..
          cd ../..
          
          find tools -mindepth 2 -name "Makefile" -exec dirname {} \; | while read dir; do
            make -C "$dir" CFLAGS="$CFLAGS"
          done

      - name: Build ROM
        run: |
          export PATH=$(pwd)/tools/agbcc/bin:$PATH
          export AGBCC=$(pwd)/tools/agbcc/bin/agbcc
          make -j$(nproc)

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CrystalDust-ROM
          path: '*.gba'
