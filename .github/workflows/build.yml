name: Build CrystalDust ROM

on:
  push:
    branches: [ "progress" ]
  pull_request:
    branches: [ "progress" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libpng-dev pkg-config git

      - name: Fix Makefile and Make Tools Compatibility
        run: |
          sed -i '163s/.*/infoshell = $(shell $1)/' Makefile
          sed -i 's/\$(TOOLDIRS):/aif2pcm bin2c gbafix gbagfx jsonproc mapjson mid2agb preproc ramscrgen rsfont scaninc:/g' Makefile
          sed -i 's/\$(TOOLDIRS):/aif2pcm bin2c gbafix gbagfx jsonproc mapjson mid2agb preproc ramscrgen rsfont scaninc:/g' make_tools.mk

      - name: Build AGBCC and Tools
        run: |
          cd tools/agbcc
          chmod +x build.sh configure
          ./build.sh
          cd ../..
          make tools

      - name: Build CrystalDust ROM
        run: |
          make -j$(nproc)
