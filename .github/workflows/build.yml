name: CrystalDust Build

on:
  push:
    branches: [ progress ]
  pull_request:
    branches: [ progress ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-9 g++-9 gcc-arm-none-eabi binutils-arm-none-eabi libpng-dev make git

      - name: Build Toolchain
        run: |
          cd tools/agbcc
          chmod -R +x .
          
          # Use a more explicit environment setup
          export CROSS_COMPILE=arm-none-eabi-
          export AS=${CROSS_COMPILE}as
          export CC_FOR_TARGET=${CROSS_COMPILE}gcc
          
          # Fix the build script environment
          # We force the compiler to treat .S files as assembly-with-cpp
          # and point the assembler to the cross-toolchain version
          export CFLAGS="-std=gnu89 -w -fno-strict-aliasing -fno-builtin -Wno-format-security -fcommon"
          export ASFLAGS="-mcpu=arm7tdmi -mthumb-interwork"
          
          # Patch the specific Makefile that is failing (gcc_arm/Makefile)
          # We inject the correct assembler explicitly
          sed -i 's|$(AS)|arm-none-eabi-as -mcpu=arm7tdmi|g' gcc_arm/Makefile
          
          ./build.sh
          
          # ... (Continue with your library builds as before)
      - name: Build ROM
        run: |
          export PATH=$(pwd)/tools/agbcc/bin:$PATH
          export AGBCC=$(pwd)/tools/agbcc/bin/agbcc
          make -j$(nproc)

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CrystalDust-ROM
          path: '*.gba'
