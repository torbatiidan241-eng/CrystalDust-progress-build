name: CrystalDust Build

on:
  push:
    branches: [ progress ]
  pull_request:
    branches: [ progress ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi libpng-dev make git

      - name: Build Toolchain
        run: |
          # Build agbcc
          cd tools/agbcc
          chmod -R +x .
          export CFLAGS="-std=gnu89 -w -fno-strict-aliasing -fno-builtin -Wno-format-security"
          ./build.sh
          [ -d "libc" ] && cd libc && make CFLAGS="$CFLAGS" && cd ..
          [ -d "libgcc" ] && cd libgcc && make CFLAGS="$CFLAGS" && cd ..
          cd ../..
          
          # Build other project tools
          find tools -mindepth 2 -name "Makefile" -exec dirname {} \; | while read dir; do
            make -C "$dir"
          done

      - name: Build ROM
        run: |
          mkdir -p build/emerald
          
          # Add local agbcc to PATH
          export PATH=$(pwd)/tools/agbcc/bin:$PATH
          
          # Force the compiler to use GBA-compatible system headers
          export CFLAGS="-I$(arm-none-eabi-gcc -print-file-name=include)"
          
          # Build the main project
          make -j$(nproc)

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CrystalDust-ROM
          path: '*.gba'
