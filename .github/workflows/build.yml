name: CrystalDust Build

on:
  push:
    branches: [ progress ]
  pull_request:
    branches: [ progress ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-arm-none-eabi binutils-arm-none-eabi libpng-dev

      - name: Prepare and Build Toolchain
        run: |
          # 1. Force recursive permissions for all tools
          # This specifically fixes 'move-if-change' and other helper scripts
          find tools -type f -exec chmod +x {} +
          
          # 2. Build agbcc
          cd tools/agbcc
          ./build.sh
          
          # 3. Verify it is a real agbcc binary
          # This should not return an error if build.sh succeeded
          ./agbcc --version
          
          # 4. Prepare bin directory
          mkdir -p bin
          cp agbcc bin/agbcc
          cd ../..

      - name: Build ROM
        run: |
          # 5. Set paths
          export AGBCC=$(pwd)/tools/agbcc/bin/agbcc
          export PATH=$(pwd)/tools/agbcc/bin:$PATH
          
          # 6. Run make
          # Ensure CC is pointed to our verified binary
          make -j$(nproc) CC="$AGBCC"
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CrystalDust-ROM
          path: '*.gba'
