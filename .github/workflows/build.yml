name: Build ROM

on:
  push:
    branches:
      - progress
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Git config
        run: git config --global core.symlinks false

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: progress

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential binutils-arm-none-eabi gcc-arm-none-eabi libpng-dev

      - name: Build tools
        run: |
          # Remove the failed folder
          rm -rf tools/agbcc
          # Clone the official repo which contains the pre-compiled tools
          git clone https://github.com/pret/agbcc tools/agbcc
          # Grant execute permissions to the binaries directly
          chmod -R +x tools/agbcc

      - name: Build ROM
        run: make

      - name: Upload ROM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: crystal-dust-rom
          path: "*.gba"
