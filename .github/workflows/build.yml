name: CrystalDust Build

on:
  push:
    branches: [ progress ]
  pull_request:
    branches: [ progress ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-9 g++-9 gcc-arm-none-eabi binutils-arm-none-eabi libpng-dev make git

      - name: Build Toolchain
        run: |
          # Clean environment
          rm -rf build/
          
          # Build agbcc
          cd tools/agbcc
          ./build.sh
          # agbcc expects its binaries to be in a bin directory relative to its source
          mkdir -p bin
          cp agbcc bin/agbcc
          cp ../../tools/agbcc/bin/* bin/ 2>/dev/null || true
          cd ../..

      - name: Build ROM
        run: |
          # Add the toolchain 'bin' directory to the PATH
          # This allows the Makefile to find the 'agbcc' compiler and its internal headers
          export PATH=$(pwd)/tools/agbcc/bin:$PATH
          
          # Set the AGBCC variable explicitly as many GBA Makefiles require it
          export AGBCC=$(pwd)/tools/agbcc/bin/agbcc
          
          # Run the build
          make -j$(nproc)

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CrystalDust-ROM
          path: '*.gba'
