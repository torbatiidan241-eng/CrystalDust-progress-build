name: CrystalDust Build

on:
  push:
    branches: [ progress ]
  pull_request:
    branches: [ progress ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-9 g++-9 gcc-arm-none-eabi binutils-arm-none-eabi libpng-dev make git

      - name: Build Toolchain
        run: |
          # Create Shim Directory for ARM tools
          mkdir -p shim
          echo '#!/bin/sh' > shim/as
          echo 'exec arm-none-eabi-as "$@"' >> shim/as
          echo '#!/bin/sh' > shim/gcc
          echo 'exec arm-none-eabi-gcc "$@"' >> shim/gcc
          chmod +x shim/as shim/gcc
          
          # Build agbcc
          cd tools/agbcc
          chmod -R +x .
          export CC=/usr/bin/gcc-9
          export CXX=/usr/bin/g++-9
          export CFLAGS="-std=gnu89 -w -fno-strict-aliasing -fno-builtin -Wno-format-security -Wno-error=implicit-function-declaration -fcommon"
          ./build.sh
          
          # Build libraries with ARM Shims
          export PATH=$(pwd)/../shim:$PATH
          [ -d "libc" ] && cd libc && make -j$(nproc) CFLAGS="$CFLAGS" && cd ..
          [ -d "libgcc" ] && cd libgcc && make -j$(nproc) CFLAGS="$CFLAGS" && cd ..
          cd ../..
          
          # Build Host Utilities (preproc, etc.)
          # Remove shim from path, unset ARM variables, and force native tools
          export PATH=$(echo $PATH | sed -e 's|'$(pwd)/shim':||')
          unset AS CC CXX AR
          
          find tools -mindepth 2 -name "Makefile" -exec dirname {} \; | while read dir; do
            if [ "$dir" != "tools/agbcc" ]; then
              make -C "$dir" CC=/usr/bin/gcc CXX=/usr/bin/g++ AS=/usr/bin/as AR=/usr/bin/ar CFLAGS="-std=gnu11 -O2 -Wall"
            fi
          done

      - name: Build ROM
        run: |
          export PATH=$(pwd)/tools/agbcc/bin:$PATH
          export AGBCC=$(pwd)/tools/agbcc/bin/agbcc
          make -j$(nproc)

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CrystalDust-ROM
          path: '*.gba'
