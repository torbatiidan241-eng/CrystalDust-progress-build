name: CrystalDust Build

on:
  push:
    branches:
      - progress

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils-arm-none-eabi gcc-arm-none-eabi libpng-dev make git

      - name: Build Toolchain and Tools
        run: |
          # Build agbcc
          cd tools/agbcc
          chmod -R +x .
          ./build.sh
          [ -d "libc" ] && cd libc && make && cd ..
          [ -d "libgcc" ] && cd libgcc && make && cd ..
          cd ../..
          
          # Build all tools (including ramscrgen)
          make -C tools
          
          # Create required build directory
          mkdir -p build/emerald

      - name: Build ROM
        run: |
          export PATH=$PATH:$(pwd)/tools/agbcc/bin
          
          # Use 'arm-none-eabi-gcc -print-sysroot' to find the correct path for stddef.h
          SYSROOT=$(arm-none-eabi-gcc -print-sysroot)
          # Pass the standard include path to the compiler via CFLAGS
          export CFLAGS="-I$SYSROOT/usr/include"
          
          # Run the main project Makefile
          make -j$(nproc)

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CrystalDust-ROM
          path: '*.gba'
