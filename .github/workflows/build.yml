name: CrystalDust Build

on:
  push:
    branches: [ progress ]
  pull_request:
    branches: [ progress ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-9 g++-9 gcc-arm-none-eabi binutils-arm-none-eabi libpng-dev make git

      - name: Build Toolchain
        run: |
          # 1. Clean build directory
          rm -rf build/
          
          # 2. Fix permissions for ALL files in the agbcc tools folder
          # This is the critical step to fix the 'Permission denied' on ./move-if-change
          cd tools/agbcc
          chmod -R +x .
          
          # 3. Build agbcc
          ./build.sh
          
          # 4. Create the bin directory for the toolchain
          mkdir -p bin
          if [ -f agbcc ]; then cp agbcc bin/agbcc; fi
          cd ../..

      - name: Build ROM
        run: |
          # 5. Point the build to the correct binaries
          export PATH=$(pwd)/tools/agbcc/bin:$PATH
          export AGBCC=$(pwd)/tools/agbcc/bin/agbcc
          
          # 6. Run the build
          make -j$(nproc)

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CrystalDust-ROM
          path: '*.gba'
