name: CrystalDust Build

on:
  push:
    branches:
      - progress

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: Initialize Submodules
        run: |
          # This pulls in the missing libagbsyscall and other dependencies
          git submodule sync --recursive
          git submodule update --init --recursive

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils-arm-none-eabi gcc-arm-none-eabi libpng-dev make git

      - name: Build Toolchain and Utilities
        run: |
          # 1. Build the GBA-specific compiler (agbcc)
          cd tools/agbcc
          chmod -R +x .
          ./build.sh
          [ -d "libc" ] && cd libc && make && cd ..
          [ -d "libgcc" ] && cd libgcc && make && cd ..
          cd ../..
          
          # 2. Build all individual tools recursively
          # This iterates through every folder in tools/ that contains a Makefile
          find tools -maxdepth 2 -name "Makefile" -exec dirname {} \; | while read dir; do
            echo "Building tool in $dir..."
            make -C "$dir"
          done

      - name: Build ROM
        run: |
          # Ensure build directory exists
          mkdir -p build/emerald
          
          # Add local agbcc to PATH
          export PATH=$(pwd)/tools/agbcc/bin:$PATH
          
          # Resolve missing headers like stddef.h and string.h
          # We dynamically point to the compiler's own include directory
          export CFLAGS="-I$(arm-none-eabi-gcc -print-file-name=include)"
          
          # Build the main project
          make -j$(nproc)

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CrystalDust-ROM
          path: '*.gba'
