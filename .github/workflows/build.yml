name: CrystalDust Build

on:
  push:
    branches: [ progress ]
  pull_request:
    branches: [ progress ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-9 g++-9 gcc-arm-none-eabi binutils-arm-none-eabi libpng-dev make git

      - name: Build Toolchain
        run: |
          cd tools/agbcc
          chmod -R +x .
          
          # 1. Build agbcc (Native Host Tool)
          export CC=/usr/bin/gcc-9
          export CXX=/usr/bin/g++-9
          export CFLAGS="-std=gnu89 -w -fno-strict-aliasing -fno-builtin -Wno-format-security -fcommon"
          ./build.sh
          
          # 2. Force the correct assembler for the library build
          # We locate the assembler that the toolchain is using and override it
          # by placing our own script there.
          mkdir -p binutils
          echo '#!/bin/sh' > binutils/as
          echo 'exec arm-none-eabi-as -mcpu=arm7tdmi -mthumb-interwork "$@"' >> binutils/as
          chmod +x binutils/as
          
          # This ensures that whenever 'as' is called in this directory, 
          # it points to our custom legacy-aware wrapper.
          export PATH=$(pwd)/binutils:$PATH
          
          # 3. Build Libraries
          export TARGET_CFLAGS="-mcpu=arm7tdmi -mthumb-interwork"
          [ -d "libc" ] && cd libc && make -j$(nproc) AS=as CFLAGS="$TARGET_CFLAGS" && cd ..
          [ -d "libgcc" ] && cd libgcc && make -j$(nproc) AS=as CFLAGS="$TARGET_CFLAGS" && cd ..
          cd ../..
          
          # 4. Build Host Utilities (preproc, etc.)
          # Reset path to remove our custom assembler wrapper
          export PATH=$(echo $PATH | sed -e 's|'$(pwd)/tools/agbcc/binutils':||')
          unset AS
          
          find tools -mindepth 2 -name "Makefile" -exec dirname {} \; | while read dir; do
            if [ "$dir" != "tools/agbcc" ]; then
              make -C "$dir" CC=/usr/bin/gcc CXX=/usr/bin/g++ AS=/usr/bin/as AR=/usr/bin/ar CFLAGS="-std=gnu11 -O2 -Wall"
            fi
          done

      - name: Build ROM
        run: |
          export PATH=$(pwd)/tools/agbcc/bin:$PATH
          make -j$(nproc)
