name: CrystalDust Build

on:
  push:
    branches:
      - progress

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils-arm-none-eabi gcc-arm-none-eabi libpng-dev make git

      - name: Build agbcc
        run: |
          # Find the build script regardless of its location
          BUILD_SCRIPT=$(find tools/agbcc -name "build.sh" | head -n 1)
          echo "Found build script at: $BUILD_SCRIPT"
          
          # Navigate to the folder containing the build script
          cd "$(dirname "$BUILD_SCRIPT")"
          chmod +x build.sh
          ./build.sh
          cd ../..
          
          # Navigate to libc and libgcc if they exist
          [ -d "tools/agbcc/libc" ] && cd tools/agbcc/libc && make && cd ../../..
          [ -d "tools/agbcc/libgcc" ] && cd tools/agbcc/libgcc && make && cd ../../..
          
          # Copy to bin
          mkdir -p tools/agbcc/bin
          if [ -f "tools/agbcc/gcc/agbcc" ]; then
            cp tools/agbcc/gcc/agbcc tools/agbcc/bin/agbcc
            cp tools/agbcc/gcc/xgcc tools/agbcc/bin/xgcc
            echo "Compiler build complete."
          else
            echo "::error::agbcc binary failed to generate in tools/agbcc/gcc/"
            exit 1
          fi

      - name: Build ROM
        run: |
          # Force the use of the newly built toolchain and cross-compiler flags
          export PATH=$PATH:$(pwd)/tools/agbcc/bin
          make CC=arm-none-eabi-gcc AR=arm-none-eabi-ar LD=arm-none-eabi-ld OBJCOPY=arm-none-eabi-objcopy -j$(nproc)

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CrystalDust-ROM
          path: '*.gba'
# Triggering a new build
