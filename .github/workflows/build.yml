name: CrystalDust Build

on:
  push:
    branches:
      - progress

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive # FIX: Ensure all sub-dependencies are pulled

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils-arm-none-eabi gcc-arm-none-eabi libpng-dev make git

      - name: Build Toolchain and Utilities
        run: |
          # 1. Build agbcc (The GBA-specific compiler)
          cd tools/agbcc
          chmod -R +x .
          ./build.sh
          [ -d "libc" ] && cd libc && make && cd ..
          [ -d "libgcc" ] && cd libgcc && make && cd ..
          cd ../..
          
          # 2. Build the rest of the tools
          # Replace your manual 'cc' calls with a loop to ensure everything is built
          for dir in tools/*/; do
            if [ -f "${dir}Makefile" ]; then
              make -C "$dir"
            fi
          done

      - name: Build ROM
        run: |
          # Ensure build directory exists BEFORE making anything
          mkdir -p build/emerald
          
          # Export path to local agbcc
          export PATH=$(pwd)/tools/agbcc/bin:$PATH
          
          # Dynamically locate the system headers for the cross-compiler
          # This fixes the missing <stddef.h> error
          SYSROOT=$(arm-none-eabi-gcc -print-sysroot)
          export CFLAGS="-I$SYSROOT/usr/include"
          
          # Build the main project
          make -j$(nproc)
