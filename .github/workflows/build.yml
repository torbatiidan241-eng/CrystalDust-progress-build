name: CrystalDust Build

on:
  push:
    branches: [ progress ]
  pull_request:
    branches: [ progress ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-arm-none-eabi binutils-arm-none-eabi libpng-dev

      - name: Fresh Toolchain Re-installation
        run: |
          rm -rf tools/agbcc
          git submodule update --init --force tools/agbcc
          find tools/agbcc -type f -exec chmod +x {} +
          cd tools/agbcc
          ./build.sh
          mkdir -p bin
          cp agbcc bin/agbcc
          cd ../..

      - name: Build ROM
        run: |
          export AGBCC=$(pwd)/tools/agbcc/bin/agbcc
          export PATH=$(pwd)/tools/agbcc/bin:$PATH
          make -j$(nproc) CC="$AGBCC"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CrystalDust-ROM
          path: '*.gba'
