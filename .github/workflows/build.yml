name: CrystalDust Build

on:
  push:
    branches:
      - progress

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive # CRITICAL: This pulls in libagbsyscall and other tools

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils-arm-none-eabi gcc-arm-none-eabi libpng-dev make git

      - name: Build Toolchain
        run: |
          cd tools/agbcc
          chmod -R +x .
          ./build.sh
          # Build libs
          [ -d "libc" ] && cd libc && make && cd ..
          [ -d "libgcc" ] && cd libgcc && make && cd ..
          cd ../..
          # Move binaries to a location the Makefile expects
          mkdir -p tools/agbcc/bin
          cp tools/agbcc/gcc/agbcc tools/agbcc/bin/agbcc 2>/dev/null || true
          cp tools/agbcc/gcc/xgcc tools/agbcc/bin/xgcc 2>/dev/null || true

      - name: Build Project Tools
        run: |
          # Build all tools (ramscrgen, gbagfx, etc.) recursively
          make -C tools

      - name: Build ROM
        run: |
          # Ensure workspace structure
          mkdir -p build/emerald
          
          # Add the local agbcc to path
          export PATH=$(pwd)/tools/agbcc/bin:$PATH
          
          # Fix stddef.h/string.h errors by pointing to the toolchain's system headers
          # This assumes standard arm-none-eabi-gcc installation
          TOOLCHAIN_INC=$(arm-none-eabi-gcc -print-file-name=include)
          export CFLAGS="-I$TOOLCHAIN_INC"
          
          # Run the main build
          make -j$(nproc)

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CrystalDust-ROM
          path: '*.gba'
