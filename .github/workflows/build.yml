name: Build CrystalDust
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare Runner Environment
        run: |
          git config --global core.symlinks false
          git config --global core.longpaths true

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libpng-dev gcc-arm-none-eabi make bison flex texinfo g++

      - name: Build Project Tools
        run: |
          chmod -R +x tools/agbcc
          cd tools/agbcc
          export CFLAGS="-w -O2 -D_FORTIFY_SOURCE=0 -Wno-builtin-declaration-mismatch -Wno-error"
          
          # Build
          cd gcc
          make clean
          make CFLAGS="$CFLAGS"
          
          # NUCLEAR OPTION: Direct binary cloning
          # 1. Ensure target path exists
          mkdir -p ../gcc_arm
          
          # 2. Use 'dd' to clone the binary bit-for-bit, bypassing file metadata issues
          # 'if' = input file, 'of' = output file, 'bs' = block size
          if [ -f "agbcc" ]; then
            echo "Cloning binary using dd..."
            dd if=agbcc of=../gcc_arm/cc1 bs=4k
            chmod +x ../gcc_arm/cc1
          else
            echo "::error::FAILURE: agbcc not found in $(pwd)"
            exit 1
          fi
          
          # 3. Final verification of the binary
          if [ -x "../gcc_arm/cc1" ]; then
            echo "Verification SUCCESS: Binary is executable."
          else
            echo "::error::FAILURE: Binary at ../gcc_arm/cc1 is not executable."
            exit 1
          fi
          
          # Continue installation
          cd ..
          ./install.sh ../
          cd ../..
          make tools
          chmod +x tools/agbcc/bin/agbcc tools/gbagfx/gbagfx tools/scaninc/scaninc tools/ramscrgen/ramscrgen

      - name: Build ROM
        run: |
          mkdir -p build/emerald
          make
        env:
          PATH: /usr/bin:/bin:/usr/local/bin:${{ github.workspace }}/tools/agbcc/bin:${{ github.workspace }}/tools/gbagfx:${{ github.workspace }}/tools/scaninc:${{ github.workspace }}/tools/ramscrgen:${{ github.workspace }}/tools/bin2c:${{ github.workspace }}/tools/gbafix:$PATH

      - name: Upload ROM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: crystal-dust-rom
          path: '*.gba'
