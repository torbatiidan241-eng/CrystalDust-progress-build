name: Build CrystalDust

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Manual Checkout
        run: |
          git init
          git config core.sparseCheckout true
          echo "/*" > .git/info/sparse-checkout
          echo "!/tools/agbcc" >> .git/info/sparse-checkout
          git remote add origin https://github.com/${{ github.repository }}
          git fetch --depth 1 origin progress
          git checkout progress

      - name: Install Dependencies
        run: |
          sudo apt-get update
          # Install only the compiler, not the massive library extras if possible
          # We keep it simple to reduce download time
          sudo apt-get install -y build-essential gcc-arm-none-eabi libpng-dev

      - name: Build ROM
        run: |
          # The compiler now has everything it needs in the default system path
          # We no longer need to pass -I$ARM_INC or specific header flags
          make rom \
               COMPARE=0 \
               CC=arm-none-eabi-gcc \
               berry_fix=true \
               payload=true \
               -j1
        env:
          PATH: /usr/bin:${{ github.workspace }}/tools/gbagfx:${{ github.workspace }}/tools/scaninc:${{ github.workspace }}/tools/ramscrgen:$PATH

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: crystal-dust-rom
          path: '*.gba'
