name: CrystalDust Build

on:
  push:
    branches:
      - progress

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils-arm-none-eabi gcc-arm-none-eabi libpng-dev make git

      - name: Build agbcc
        run: |
          cd tools/agbcc
          # Ensure build scripts are executable
          chmod -R +x .
          
          # Force the use of legacy-friendly flags to ignore modern strictness
          # -w: suppress all warnings
          # -fgnu89-inline: critical for legacy GCC compilation
          export CFLAGS="-w -fgnu89-inline"
          
          # Clean any previous failed attempts
          make clean || true
          
          # Attempt to build, capturing output to a file for better debugging
          ./build.sh > build_log.txt 2>&1 || { cat build_log.txt; exit 1; }
          
          # Setup bin directory as expected by the ROM Makefile
          mkdir -p bin
          if [ -f "gcc/agbcc" ]; then
            cp gcc/agbcc bin/agbcc
          fi
          cd ../..

      - name: Build ROM
        run: |
          # Use explicit cross-compiler variables to avoid path issues
          make CC=arm-none-eabi-gcc AR=arm-none-eabi-ar LD=arm-none-eabi-ld OBJCOPY=arm-none-eabi-objcopy -j$(nproc)

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CrystalDust-ROM
          path: '*.gba'
