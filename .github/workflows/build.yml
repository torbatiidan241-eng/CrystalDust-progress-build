name: CrystalDust Build

on:
  push:
    branches:
      - progress

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils-arm-none-eabi gcc-arm-none-eabi libpng-dev make git

      - name: Build agbcc
        run: |
          cd tools/agbcc
          # Clean any old build artifacts first
          make clean || true 
          # Ensure permissions are correct
          chmod -R +x .
          ./build.sh
          cd ../..
          else
            echo "Error: Directory tools/agbcc not found."
            exit 1
          fi

      - name: Build ROM
        run: make -j$(nproc)

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CrystalDust-ROM
          path: '*.gba'
