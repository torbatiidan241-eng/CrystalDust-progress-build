name: Build ROM

on:
  push:
    branches:
      - progress
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Git config
        run: git config --global core.symlinks false

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: progress

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential binutils-arm-none-eabi gcc-arm-none-eabi libpng-dev libc6-dev

      - name: Build tools
        run: |
          # Build agbcc
          rm -rf tools/agbcc
          git clone https://github.com/pret/agbcc tools/agbcc
          cd tools/agbcc && ./build.sh && mkdir -p bin && cp agbcc bin/ && cd ../..
          
          # Build other required tools
          for tool in scaninc preproc ramscrgen gbagfx gbafix; do
              make -C tools/$tool
              mkdir -p tools/$tool
              cp tools/$tool/$tool tools/$tool/ || true
          done

      - name: Build ROM
        run: |
          # Create build directories
          mkdir -p build/src build/data
          
          # Create a dummy stddef.h to satisfy the compiler without pulling in system headers
          mkdir -p include/dummy
          echo "typedef unsigned int size_t; typedef int ptrdiff_t;" > include/dummy/stddef.h
          
          # Add tools to path
          export PATH=$(pwd)/tools/agbcc/bin:$(pwd)/tools/preproc:$(pwd)/tools/scaninc:$PATH
          
          # Build ROM with forced ARM toolchain
          # -nostdinc: Prevents system header inclusion
          # -ffreestanding: Tells compiler no standard C library exists
          # -Iinclude/dummy: Redirects stddef.h requests to our safe dummy file
          # -Iinclude: Forces use of project-specific headers
          make TOOLCHAIN_PREFIX=arm-none-eabi- \
               MKDIR="mkdir -p" \
               CC="arm-none-eabi-gcc -nostdinc -ffreestanding -Iinclude/dummy -Iinclude -include include/gba/gba.h" \
               CPP="arm-none-eabi-cpp -nostdinc -ffreestanding -Iinclude/dummy -Iinclude -include include/gba/gba.h" \
               AS=arm-none-eabi-as \
               AR=arm-none-eabi-ar \
               LD=arm-none-eabi-ld \
               OBJCOPY=arm-none-eabi-objcopy

      - name: Upload ROM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: crystal-dust-rom
          path: "*.gba"
