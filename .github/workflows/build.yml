name: Build CrystalDust
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    # This image contains the full devkitARM and agbcc toolchain pre-installed
    container:
      image: ghcr.io/pret/agbcc:latest 
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Build ROM
        run: |
          # Since the toolchain is in the container, just run make
          make
        env:
          # Point to the container's pre-installed toolchain
          PATH: /opt/agbcc/bin:/usr/local/bin:/usr/bin:/bin:$PATH

      - name: Upload ROM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: crystal-dust-rom
          path: '*.gba'
