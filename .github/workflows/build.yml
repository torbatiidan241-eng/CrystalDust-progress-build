name: Build CrystalDust

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Configure Git
        run: |
          git config --global core.symlinks false
          git config --global core.longpaths true

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          ref: progress

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential binutils-arm-none-eabi libpng-dev

      - name: Initialize Environment
        run: |
          # 1. Force submodule update
          git submodule update --init --recursive
          
          # 2. Recreate required build directories manually
          # The Makefile needs these to exist before it starts
          mkdir -p build/emerald/src build/modern/src
          
          # 3. Dummy agbcc
          mkdir -p tools/agbcc/bin
          touch tools/agbcc/bin/agbcc
          chmod +x tools/agbcc/bin/agbcc

      - name: Build Tools
        run: |
          make tools

      - name: Build ROM
        run: |
          # Do NOT run 'make clean'. We already ensured the environment is clean.
          # Building directly.
          make COMPARE=0 -j$(nproc)
        env:
          PATH: /usr/bin:${{ github.workspace }}/tools/gbagfx:${{ github.workspace }}/tools/scaninc:${{ github.workspace }}/tools/ramscrgen:$PATH

      - name: Upload ROM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: crystal-dust-rom
          path: '*.gba'
