name: CrystalDust Build

on:
  push:
    branches:
      - progress

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils-arm-none-eabi gcc-arm-none-eabi libpng-dev make git

      - name: Build agbcc
        run: |
          cd tools/agbcc
          chmod -R +x .
          # Force clean and build with legacy flags
          make clean
          export CFLAGS="-w -fgnu89-inline"
          ./build.sh
          
          # CRITICAL: Verify binary exists before moving on
          if [ -f "gcc/agbcc" ]; then
            mkdir -p bin
            cp gcc/agbcc bin/agbcc
            cp gcc/xgcc bin/xgcc
            echo "Compiler verified."
          else
            echo "::error::agbcc failed to build. Check tools/agbcc/build.sh output."
            exit 1
          fi
          cd ../..

      - name: Build ROM
        run: |
          # Use explicit cross-compiler variables and prevent fallback
          make CC=arm-none-eabi-gcc AR=arm-none-eabi-ar LD=arm-none-eabi-ld OBJCOPY=arm-none-eabi-objcopy -j$(nproc)
