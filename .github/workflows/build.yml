name: CrystalDust Build

on:
  push:
    branches:
      - progress

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          # Ensure we have the full toolchain and cross-libc
          sudo apt-get install -y binutils-arm-none-eabi gcc-arm-none-eabi libpng-dev make git
          
          # 2. Find the path to the arm-none-eabi compiler headers
          # This varies on different Ubuntu versions, but this finds it automatically
          GCC_PATH=$(dirname $(which arm-none-eabi-gcc))/../lib/gcc/arm-none-eabi/*/include
          
          # 3. Build using the correct include paths
          # We pass CFLAGS to tell the compiler where to find stddef.h
          make CFLAGS="-I$GCC_PATH" CC=arm-none-eabi-gcc AR=arm-none-eabi-ar LD=arm-none-eabi-ld OBJCOPY=arm-none-eabi-objcopy -j$(nproc)
      - name: Build agbcc
        run: |
          cd tools/agbcc
          
          # 1. Apply permissions recursively to prevent 'Permission denied'
          chmod -R +x .
          
          # 2. Build the core compiler
          ./build.sh
          
          # 3. Build libc and libgcc if they exist
          [ -d "libc" ] && cd libc && make && cd ..
          [ -d "libgcc" ] && cd libgcc && make && cd ..
          cd ../..
          
          # 4. Finalize bin directory
          mkdir -p tools/agbcc/bin
          
          # Use find to locate the 'agbcc' binary wherever it was created
          BINARY=$(find tools/agbcc -name "agbcc" -type f | head -n 1)
          
          if [ -f "$BINARY" ]; then
            cp "$BINARY" tools/agbcc/bin/agbcc
            # Also try to copy xgcc if it exists in the same folder
            XGCC=$(dirname "$BINARY")/xgcc
            [ -f "$XGCC" ] && cp "$XGCC" tools/agbcc/bin/xgcc
            echo "Compiler successfully moved to tools/agbcc/bin"
          else
            echo "::error::agbcc binary not found after build."
            exit 1
          fi

      - name: Build ROM
        run: |
          # 1. Add agbcc to PATH
          export PATH=$PATH:$(pwd)/tools/agbcc/bin
          
          # Run the main project Makefile
          make CC=arm-none-eabi-gcc AR=arm-none-eabi-ar LD=arm-none-eabi-ld OBJCOPY=arm-none-eabi-objcopy -j$(nproc)

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CrystalDust-ROM
          path: '*.gba'
