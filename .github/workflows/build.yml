name: Build Crystal Dust ROM

on:
  push:
    branches: [ progress ]
  pull_request:
    branches: [ progress ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Configure Git Settings
        run: |
          git config --global core.symlinks false

      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libpng-dev zlib1g-dev git binutils-arm-none-eabi gcc-arm-none-eabi

      - name: Build Tools and ROM
        run: |
          cd tools/agbcc/gcc
          make -f Makefile.in || make
          cd ../../../
          make tools
          make

      - name: Upload ROM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: crystal-dust-rom
          path: '*.gba'
