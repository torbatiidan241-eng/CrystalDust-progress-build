name: CrystalDust Build

on: [push]

jobs:
  build:
    runs-on: ubuntu-20.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Install Dependencies
        run: |
          sudo apt-get update
          # bison and flex are critical for generating those missing .c files
          sudo apt-get install -y build-essential libpng-dev gcc-arm-none-eabi bison flex

      - name: Build Compiler (agbcc)
        run: |
          cd tools/agbcc
          chmod +x build.sh
          # Attempt to build
          ./build.sh
          # Ensure binary is in the right place
          mkdir -p bin
          # Check if build output exists in root of agbcc or in gcc subfolder
          if [ -f agbcc ]; then
            cp agbcc bin/agbcc
          elif [ -f gcc/agbcc ]; then
            cp gcc/agbcc bin/agbcc
          else
            echo "Error: agbcc binary not found after build."
            exit 1
          fi
          cd ../..

      - name: Build Game
        run: |
          export PATH=$PATH:$(pwd)/tools/agbcc/bin
          make -j$(nproc)

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CrystalDust-ROM
          path: '*.gba'
