name: CrystalDust Build

on:
  push:
    branches:
      - progress

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          # agbcc is the compiler, binutils-arm-none-eabi is for the assembly linking
          sudo apt-get install -y binutils-arm-none-eabi gcc-arm-none-eabi libpng-dev make git
          
          # Note: You may need to clone/install agbcc if it's not provided 
          # by the Ubuntu repositories. Many projects include a 
          # 'tools/agbcc' setup script.
          
      - name: Build ROM
        run: make -j$(nproc)

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CrystalDust-ROM
          path: '*.gba'
