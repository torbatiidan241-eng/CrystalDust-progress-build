name: CrystalDust Build

on:
  push:
    branches:
      - progress

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils-arm-none-eabi gcc-arm-none-eabi libpng-dev make git

      - name: Cache agbcc
        id: cache-agbcc
        uses: actions/cache@v4
        with:
          path: tools/agbcc
          key: ${{ runner.os }}-agbcc

      - name: Build Toolchain
        if: steps.cache-agbcc.outputs.cache-hit != 'true'
        run: |
          set -e
          cd tools/agbcc
          # ADD THIS LINE:
          chmod +x build.sh
          ./build.sh
          ...
          # Build remaining project tools
          find tools -mindepth 2 -name "Makefile" -exec dirname {} \; | while read dir; do
            make -C "$dir"
          done

      - name: Build ROM
        run: |
          set -e
          export PATH=$(pwd)/tools/agbcc/bin:$PATH
          # Pointing to the correct system headers for the cross-compiler
          export CFLAGS="-I$(arm-none-eabi-gcc -print-file-name=include)"
          make -j$(nproc)

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CrystalDust-ROM
          path: '*.gba'
