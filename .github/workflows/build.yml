name: Build CrystalDust ROM

on:
  push:
    branches: [ "progress" ]
  pull_request:
    branches: [ "progress" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Configure Git Settings
        run: |
          git config --global core.symlinks false
          git config --global core.longpaths true

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libpng-dev pkg-config git gcc-arm-none-eabi binutils-arm-none-eabi python3

      - name: Clone and Setup AGBCC
        run: |
          rm -rf tools/agbcc
          git clone https://github.com/pret/agbcc.git tools/agbcc

      - name: Fix Makefile Compatibility
        run: |
          sed -i '163s/.*/infoshell = $(shell $1)/' Makefile

      - name: Build AGBCC and Tools Manually
        run: |
          cd tools/agbcc
          chmod +x build.sh
          ./build.sh
          mkdir -p bin
          cp agbcc bin/
          find . -name "cc1" -exec cp {} bin/ \;
          cd ../..
          make -C tools/scaninc
          make -C tools/ramscrgen
          make -C tools/preproc
          make -C tools/bin2c
          make -C tools/jsonproc
          make -C tools/mapjson
          make -C tools/mid2agb
          make -C tools/rsfont
          make -C tools/aif2pcm
          cd tools/gbagfx && make clean && gcc -Wall -Wextra -Wno-sign-compare -std=gnu99 -O2 -DPNG_SKIP_SETJMP_CHECK main.c convert_png.c gfx.c jasc_pal.c act.c lz.c rl.c util.c font.c huff.c -o gbagfx -lpng -lz && cd ../..

      - name: Build CrystalDust ROM Single-Threaded
        run: |
          export CPATH="/usr/lib/gcc/arm-none-eabi/$(arm-none-eabi-gcc -dumpversion)/include"
          make CPPFLAGS="-Iinclude -I$CPATH -std=gnu89" AGBCC_CPPFLAGS="-Iinclude -I$CPATH" CFLAGS="-w -std=gnu89" AGBCC_CFLAGS="-w"
