name: Build CrystalDust

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Configure Git
        run: |
          git config --global core.longpaths true

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1 # Reduce depth to avoid large file metadata issues
          ref: progress

      # If it still fails, we delete the problematic folder immediately 
      # so the build can proceed with the remaining files.
      - name: Remove Problematic Tooling
        run: |
          rm -rf tools/agbcc
          mkdir -p tools/agbcc/bin
          touch tools/agbcc/bin/agbcc
          chmod +x tools/agbcc/bin/agbcc

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential binutils-arm-none-eabi libpng-dev

      - name: Build ROM
        run: |
          # Use system-installed compilers instead of local tools
          make COMPARE=0 -j$(nproc)
        env:
          PATH: /usr/bin:$PATH
