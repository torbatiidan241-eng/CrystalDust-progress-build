name: Build CrystalDust ROM

on:
  push:
    branches: [ "progress" ]
  pull_request:
    branches: [ "progress" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Disable Git symlinks prior to checkout
        run: |
          git config --global core.symlinks false

      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          ref: progress
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libpng-dev

      - name: Repair corrupted agbcc symlinks
        run: |
          rm -f tools/agbcc/gcc_arm/obstack.c tools/agbcc/gcc_arm/splay-tree.c
          ln -s ../../gcc/obstack.c tools/agbcc/gcc_arm/obstack.c
          ln -s ../../gcc/splay-tree.c tools/agbcc/gcc_arm/splay-tree.c

      - name: Build agbcc and tools
        run: |
          make -C tools/agbcc
          make tools

      - name: Compile ROM
        run: |
          make -j$(nproc)

      - name: Upload compiled ROM artifact
        uses: actions/upload-artifact@v4
        with:
          name: CrystalDust-progress-rom
          path: "*.gba"
