name: Build CrystalDust
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare Runner Environment
        run: |
          git config --global core.symlinks false
          git config --global core.longpaths true

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          # Added bison, flex, and texinfo which are required to build the agbcc compiler
          sudo apt-get install -y build-essential libpng-dev gcc-arm-none-eabi make bison flex texinfo

      - name: Build Project Tools
        run: |
          chmod -R +x tools/agbcc
          
          # Clean and rebuild agbcc
          cd tools/agbcc
          # Remove previous build attempts
          rm -rf gcc_arm
          
          # Build compiler with aggressive cleaning
          ./build.sh
          ./install.sh ../
          cd ../..
          
          # Build remaining tools
          make tools
          chmod +x tools/agbcc/bin/agbcc tools/gbagfx/gbagfx tools/scaninc/scaninc tools/ramscrgen/ramscrgen

      - name: Build ROM
        run: |
          mkdir -p build/emerald
          make
        env:
          PATH: /usr/bin:/bin:/usr/local/bin:${{ github.workspace }}/tools/agbcc/bin:${{ github.workspace }}/tools/gbagfx:${{ github.workspace }}/tools/scaninc:${{ github.workspace }}/tools/ramscrgen:${{ github.workspace }}/tools/bin2c:${{ github.workspace }}/tools/gbafix:$PATH

      - name: Upload ROM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: crystal-dust-rom
          path: '*.gba'
