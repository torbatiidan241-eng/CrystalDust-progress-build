name: Build CrystalDust

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Manual Checkout
        run: |
          git init
          git config core.sparseCheckout true
          echo "/*" > .git/info/sparse-checkout
          echo "!/tools/agbcc" >> .git/info/sparse-checkout
          git remote add origin https://github.com/${{ github.repository }}
          git fetch --depth 1 origin progress
          git checkout progress

      - name: Prepare Environment
        run: |
          mkdir -p build/src
          mkdir -p tools/agbcc/bin
          touch tools/agbcc/bin/agbcc
          chmod +x tools/agbcc/bin/agbcc

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-arm-none-eabi libpng-dev

      - name: Build ROM
        run: |
          # Build only the main ROM target to avoid berry_fix/payload
          make COMPARE=0 CC=arm-none-eabi-gcc CrystalDust.gba -j$(nproc)
        env:
          PATH: /usr/bin:$PATH

      - name: Upload ROM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: crystal-dust-rom
          path: '*.gba'
