name: Build CrystalDust

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Configure Git
        run: |
          git config --global core.symlinks false
          git config --global core.longpaths true

      - name: Manual Checkout
        run: |
          git init
          git remote add origin https://github.com/${{ github.repository }}
          git fetch --depth 1 origin progress
          git checkout progress
          git submodule update --init --recursive

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-arm-none-eabi libpng-dev

      - name: Prepare Environment
        run: |
          # Create build directory
          mkdir -p build/src
          
          # Remove broken submodule and replace with dummy
          rm -rf tools/agbcc
          mkdir -p tools/agbcc/bin
          touch tools/agbcc/bin/agbcc
          chmod +x tools/agbcc/bin/agbcc
          
          # Build tools
          make tools
          chmod +x tools/gbagfx/gbagfx tools/scaninc/scaninc tools/ramscrgen/ramscrgen

      - name: Build ROM
        run: |
          # Locate system header path
          INCLUDE_PATH=$(arm-none-eabi-gcc -print-file-name=include)
          
          # Force the use of system toolchain via environment variables
          # This overrides the internal Makefile 'CC' and 'AS' variables
          make COMPARE=0 \
               CC=arm-none-eabi-gcc \
               AS=arm-none-eabi-as \
               LD=arm-none-eabi-ld \
               CFLAGS="-I$INCLUDE_PATH -DARM_ASM" \
               -j$(nproc)
        env:
          PATH: /usr/bin:${{ github.workspace }}/tools/gbagfx:${{ github.workspace }}/tools/scaninc:${{ github.workspace }}/tools/ramscrgen:$PATH

      - name: Upload ROM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: crystal-dust-rom
          path: '*.gba'
