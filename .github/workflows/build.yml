name: Build CrystalDust
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare Runner Environment
        run: |
          git config --global core.symlinks false
          git config --global core.longpaths true

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libpng-dev gcc-arm-none-eabi make bison flex texinfo g++

      - name: Build Project Tools
        run: |
          chmod -R +x tools/agbcc
          cd tools/agbcc
          export CFLAGS="-w -O2 -D_FORTIFY_SOURCE=0 -Wno-builtin-declaration-mismatch -Wno-error"
          
          # Navigate into gcc and build
          cd gcc
          make clean
          make CFLAGS="$CFLAGS"
          
          # DEBUG: List directory to confirm file presence
          echo "DEBUG: Current directory is $(pwd)"
          ls -F
          
          # Use an absolute path test
          TARGET_DIR="$(dirname "$(pwd)")/gcc_arm"
          mkdir -p "$TARGET_DIR"
          
          if [ -f "agbcc" ]; then
            echo "SUCCESS: agbcc found. Moving it to $TARGET_DIR/cc1"
            cp agbcc "$TARGET_DIR/cc1"
          else
            echo "::error::FAILURE: 'agbcc' was not generated in $(pwd)"
            exit 1
          fi
          
          # Continue installation
          cd ..
          ./install.sh ../
          cd ../..
          
          # Build remaining tools
          make tools
          chmod +x tools/agbcc/bin/agbcc tools/gbagfx/gbagfx tools/scaninc/scaninc tools/ramscrgen/ramscrgen

      - name: Build ROM
        run: |
          mkdir -p build/emerald
          make
        env:
          PATH: /usr/bin:/bin:/usr/local/bin:${{ github.workspace }}/tools/agbcc/bin:${{ github.workspace }}/tools/gbagfx:${{ github.workspace }}/tools/scaninc:${{ github.workspace }}/tools/ramscrgen:${{ github.workspace }}/tools/bin2c:${{ github.workspace }}/tools/gbafix:$PATH

      - name: Upload ROM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: crystal-dust-rom
          path: '*.gba'
