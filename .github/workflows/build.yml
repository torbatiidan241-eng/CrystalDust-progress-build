name: CrystalDust Build

on:
  push:
    branches: [ progress ]
  pull_request:
    branches: [ progress ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-9 g++-9 gcc-arm-none-eabi binutils-arm-none-eabi libpng-dev make git

      - name: Build Toolchain
        run: |
          cd tools/agbcc
          chmod -R +x .
          
          # Setup environment
          export CROSS_COMPILE=arm-none-eabi-
          export AS=${CROSS_COMPILE}as
          export CC_FOR_TARGET=${CROSS_COMPILE}gcc
          
          # Patch the Makefile if it exists in the expected location
          if [ -f "gcc_arm/Makefile" ]; then
            sed -i 's|$(AS)|arm-none-eabi-as -mcpu=arm7tdmi|g' gcc_arm/Makefile
          else
            echo "Warning: gcc_arm/Makefile not found, checking directory structure..."
            find . -name "Makefile"
          fi
          
          # Build agbcc
          export CC=/usr/bin/gcc-9
          export CXX=/usr/bin/g++-9
          export CFLAGS="-std=gnu89 -w -fno-strict-aliasing -fno-builtin -Wno-format-security -fcommon"
          ./build.sh
          
          # Build libraries
          export PATH=$(pwd)/../shim:$PATH
          [ -d "libc" ] && cd libc && make -j$(nproc) CFLAGS="$CFLAGS" && cd ..
          [ -d "libgcc" ] && cd libgcc && make -j$(nproc) CFLAGS="$CFLAGS" && cd ..
          cd ../..
          
          # Build Host Utilities (preproc, etc.)
          export PATH=$(echo $PATH | sed -e 's|'$(pwd)/shim':||')
          unset AS CC CXX AR
          
          find tools -mindepth 2 -name "Makefile" -exec dirname {} \; | while read dir; do
            if [ "$dir" != "tools/agbcc" ]; then
              make -C "$dir" CC=/usr/bin/gcc CXX=/usr/bin/g++ AS=/usr/bin/as AR=/usr/bin/ar CFLAGS="-std=gnu11 -O2 -Wall"
            fi
          done
          
          # ... (Continue with your library builds as before)
      - name: Build ROM
        run: |
          export PATH=$(pwd)/tools/agbcc/bin:$PATH
          export AGBCC=$(pwd)/tools/agbcc/bin/agbcc
          make -j$(nproc)

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CrystalDust-ROM
          path: '*.gba'
