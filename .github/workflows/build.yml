name: CrystalDust Build

on:
  push:
    branches: [ progress ]
  pull_request:
    branches: [ progress ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi libpng-dev make

      - name: Get Toolchain
        run: |
          # Ensure tools directory exists
          mkdir -p tools/agbcc
          # Download the pre-built agbcc binary directly
          # Using a reliable mirror for the GBA toolchain
          curl -L https://github.com/pret/agbcc/releases/latest/download/agbcc.tar.gz -o agbcc.tar.gz
          tar -xzf agbcc.tar.gz -C tools/agbcc/
          chmod +x tools/agbcc/agbcc

      - name: Build ROM
        run: |
          # Add the toolchain to the PATH
          export PATH=$(pwd)/tools/agbcc:$PATH
          export AGBCC=$(pwd)/tools/agbcc/agbcc
          
          # Run the build
          make -j$(nproc)

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CrystalDust-ROM
          path: '*.gba'
