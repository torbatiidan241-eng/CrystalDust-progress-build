name: Build CrystalDust

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false # Disable submodule checkout entirely
          fetch-depth: 1

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-arm-none-eabi libpng-dev

      - name: Build
        run: |
          # 1. Create directory structure manually
          mkdir -p build/src
          
          # 2. Build ONLY the main ROM target. 
          # We bypass 'make' (which defaults to all) to avoid berry_fix/payload
          # Adjust 'CrystalDust.gba' to your actual ROM filename
          make COMPARE=0 CC=arm-none-eabi-gcc CrystalDust.gba -j$(nproc)
        env:
          PATH: /usr/bin:$PATH

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: crystal-dust-rom
          path: '*.gba'
