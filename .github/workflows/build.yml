name: CrystalDust Build

on:
  push:
    branches:
      - progress

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils-arm-none-eabi gcc-arm-none-eabi libpng-dev make git

      - name: Build agbcc
        run: |
          # Navigate to the toolchain directory
          cd tools/agbcc
          
          # CRITICAL: Fix permissions for all scripts
          # This ensures 'move-if-change' and others can run
          find . -type f -name "*.sh" -exec chmod +x {} +
          chmod +x gcc/move-if-change
          
          # Build script execution
          ./build.sh
          
          # Build libc/libgcc if they exist
          [ -d "libc" ] && cd libc && make && cd ..
          [ -d "libgcc" ] && cd libgcc && make && cd ..
          cd ../..
          
          # Finalize
          mkdir -p tools/agbcc/bin
          if [ -f "tools/agbcc/gcc/agbcc" ]; then
            cp tools/agbcc/gcc/agbcc tools/agbcc/bin/agbcc
            cp tools/agbcc/gcc/xgcc tools/agbcc/bin/xgcc
          else
            echo "::error::agbcc binary not found."
            exit 1
          fi
      - name: Build ROM
        run: |
          # Force the use of the newly built toolchain and cross-compiler flags
          export PATH=$PATH:$(pwd)/tools/agbcc/bin
          make CC=arm-none-eabi-gcc AR=arm-none-eabi-ar LD=arm-none-eabi-ld OBJCOPY=arm-none-eabi-objcopy -j$(nproc)

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CrystalDust-ROM
          path: '*.gba'
# Triggering a new build
