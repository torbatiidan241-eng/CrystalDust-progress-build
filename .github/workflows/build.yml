name: CrystalDust Build

on:
  push:
    branches: [ progress ]

jobs:
  build:
    runs-on: ubuntu-latest
    # This uses a pre-built environment with all tools included
    container:
      image: ghcr.io/pret/agbcc-container:latest 
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive # Let's handle submodules correctly this time

      - name: Build ROM
        run: |
          make -j$(nproc)
          
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CrystalDust-ROM
          path: '*.gba'
