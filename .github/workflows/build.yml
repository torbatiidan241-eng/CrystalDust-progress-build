name: Build CrystalDust

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Pre-configure Git
        run: |
          # These settings must be applied BEFORE checkout
          git config --global core.symlinks false
          git config --global core.longpaths true
          git config --global advice.detachedHead false

      - name: Manual Checkout
        run: |
          # Manually initialize the repo to avoid the constraints of actions/checkout
          git init
          git remote add origin https://github.com/${{ github.repository }}
          git fetch --depth 1 origin progress
          git checkout progress

      - name: Post-Checkout Cleanup
        run: |
          # Force remove the problematic submodule directory
          rm -rf tools/agbcc
          mkdir -p tools/agbcc/bin
          touch tools/agbcc/bin/agbcc
          chmod +x tools/agbcc/bin/agbcc

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential binutils-arm-none-eabi libpng-dev

      - name: Build ROM
        run: |
          # Use system-installed compilers to bypass the submodule issues
          make COMPARE=0 -j$(nproc)
        env:
          PATH: /usr/bin:$PATH

      - name: Upload ROM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: crystal-dust-rom
          path: '*.gba'
