name: CrystalDust Build

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Build ROM
        run: |
          # Just point directly to the binary you committed
          export PATH=$(pwd)/tools/bin:$PATH
          make
          
      - name: Upload ROM
        uses: actions/upload-artifact@v4
        with:
          name: CrystalDust-ROM
          path: '*.gba'
