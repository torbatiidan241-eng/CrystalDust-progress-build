name: CrystalDust Build

on:
  push:
    branches:
      - progress

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libpng-dev gcc-arm-none-eabi bison flex autoconf automake

      - name: Build Compiler (agbcc)
        run: |
          cd tools/agbcc
          # Ensure a clean state to prevent gengenrtl errors
          rm -rf bin
          chmod +x build.sh
          ./build.sh
          # Verify binary existence
          mkdir -p bin
          if [ -f agbcc ]; then
            cp agbcc bin/agbcc
          elif [ -f gcc/agbcc ]; then
            cp gcc/agbcc bin/agbcc
          else
            echo "Error: agbcc binary not found after build."
            exit 1
          fi
          cd ../..

      - name: Build Game
        run: |
          export PATH=$PATH:$(pwd)/tools/agbcc/bin
          make -j$(nproc)

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CrystalDust-ROM
          path: '*.gba'
