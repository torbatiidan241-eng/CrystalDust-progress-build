name: CrystalDust Build

on:
  push:
    branches:
      - progress

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils-arm-none-eabi gcc-arm-none-eabi libpng-dev make git

      - name: Build agbcc
        run: |
          if [ -d "tools/agbcc" ]; then
            cd tools/agbcc
            chmod -R +x .
            # Run the build script
            ./build.sh
            # Check for the binary and move to expected location
            if [ -f "gcc/agbcc" ]; then
              mkdir -p bin
              cp gcc/agbcc bin/agbcc
              cp gcc/xgcc bin/xgcc
              echo "agbcc successfully built and copied."
            else
              echo "Error: agbcc binary not found in gcc/ directory."
              ls -l gcc/
              exit 1
            fi
            cd ../..
          else
            echo "Error: Directory tools/agbcc not found."
            exit 1
          fi

      - name: Build ROM
        run: |
          # Use cross-compiler flags to force correct toolchain usage
          make CC=arm-none-eabi-gcc AR=arm-none-eabi-ar LD=arm-none-eabi-ld OBJCOPY=arm-none-eabi-objcopy -j$(nproc)

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CrystalDust-ROM
          path: '*.gba'
