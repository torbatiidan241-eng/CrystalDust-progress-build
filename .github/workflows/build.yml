name: Build CrystalDust
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare Runner Environment
        run: |
          git config --global core.symlinks false
          git config --global core.longpaths true

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libpng-dev gcc-arm-none-eabi make

      - name: Build Project Tools
        run: |
          # 1. Recursive chmod to ensure all build scripts (like move-if-change) are executable
          chmod -R +x tools/agbcc
          
          # 2. Build the special agbcc compiler
          cd tools/agbcc
          ./build.sh
          ./install.sh ../
          cd ../..
          
          # 3. Build the remaining repository tools
          make tools
          
          # 4. Final safety check on permissions
          chmod +x tools/agbcc/bin/agbcc tools/gbagfx/gbagfx tools/scaninc/scaninc tools/ramscrgen/ramscrgen

      - name: Build ROM
        run: |
          mkdir -p build/emerald
          make
        env:
          # Inject tool paths so the Makefile finds the newly built binaries
          PATH: /usr/bin:/bin:/usr/local/bin:${{ github.workspace }}/tools/agbcc/bin:${{ github.workspace }}/tools/gbagfx:${{ github.workspace }}/tools/scaninc:${{ github.workspace }}/tools/ramscrgen:${{ github.workspace }}/tools/bin2c:${{ github.workspace }}/tools/gbafix:$PATH

      - name: Upload ROM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: crystal-dust-rom
          path: '*.gba'
