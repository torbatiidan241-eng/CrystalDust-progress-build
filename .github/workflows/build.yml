name: CrystalDust Build

on:
  push:
    branches:
      - progress

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libpng-dev gcc-arm-none-eabi bison flex autoconf automake

      - name: Build Compiler (agbcc)
        run: |
          cd tools/agbcc
          # Try using a legacy make command or explicitly cleaning
          make clean
          # Some agbcc versions require specific flags; ensure your build.sh 
          # isn't being interrupted by the shell environment.
          ./build.sh || (echo "Build failed, attempting legacy fix..." && ./build.sh)
          
          # If it fails here, the issue is that your local tools/agbcc/gcc 
          # folder is likely missing the 'gen' files that should have been 
          # included in the repo.

      - name: Build Game
        run: |
          export PATH=$PATH:$(pwd)/tools/agbcc/bin
          make -j$(nproc)

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CrystalDust-ROM
          path: '*.gba'
