name: Build CrystalDust (progress)

on:
  push:
    branches: [ "progress" ]
  pull_request:
    branches: [ "progress" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/pret/pokedecomp:latest

    steps:
      - name: Disable Git symlinks prior to checkout
        run: |
          git config --global core.symlinks false

      - name: Checkout progress branch
        uses: actions/checkout@v4
        with:
          ref: progress

      - name: Repair corrupted agbcc symlinks
        run: |
          rm -f tools/agbcc/gcc_arm/obstack.c tools/agbcc/gcc_arm/splay-tree.c
          ln -s ../../gcc/obstack.c tools/agbcc/gcc_arm/obstack.c
          ln -s ../../gcc/splay-tree.c tools/agbcc/gcc_arm/splay-tree.c

      - name: Build tools and agbcc
        run: |
          make -C tools/agbcc
          make tools

      - name: Build CrystalDust ROM
        run: |
          make -j$(nproc)

      - name: Upload compiled GBA ROM
        uses: actions/upload-artifact@v4
        with:
          name: CrystalDust-progress-rom
          path: "*.gba"
