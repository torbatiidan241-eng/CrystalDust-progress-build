name: Build ROM

on:
  push:
    branches:
      - progress
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Git config
        run: git config --global core.symlinks false

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: progress

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential binutils-arm-none-eabi gcc-arm-none-eabi libpng-dev libc6-dev

      - name: Build tools
        run: |
          rm -rf tools/agbcc
          git clone https://github.com/pret/agbcc tools/agbcc
          chmod -R +x tools/agbcc

      - name: Build ROM
        run: |
          # Create build directories manually to avoid Makefile directory creation errors
          mkdir -p build/src build/data
          
          # Build the ROM
          # NOTRACE=1: Skips the problematic internal tool-building logic
          # TOOLCHAIN_PREFIX/CC/CPP/etc: Forces usage of arm-none-eabi tools
          make NOTRACE=1 \
               TOOLCHAIN_PREFIX=arm-none-eabi- \
               AGT_PATH=$(pwd)/tools/agbcc \
               CC=arm-none-eabi-gcc \
               CPP=arm-none-eabi-cpp \
               AS=arm-none-eabi-as \
               AR=arm-none-eabi-ar \
               LD=arm-none-eabi-ld \
               OBJCOPY=arm-none-eabi-objcopy

      - name: Upload ROM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: crystal-dust-rom
          path: "*.gba"
