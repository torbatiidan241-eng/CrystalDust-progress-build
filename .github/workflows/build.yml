name: CrystalDust Build

on:
  push:
    branches: [ progress ]
  pull_request:
    branches: [ progress ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-9 g++-9 gcc-arm-none-eabi binutils-arm-none-eabi libpng-dev make git

      - name: Build All Tools
        run: |
          # 1. Compile host tools explicitly to ensure they exist and are executable
          # This bypasses the implicit Makefile rules that are failing
          cd tools
          for tool in gbagfx preproc scaninc ramscrgen; do
            echo "Building $tool..."
            if [ -d "$tool" ]; then
              cd "$tool"
              make clean || true
              make CC=gcc CXX=g++
              chmod +x * || true
              cd ..
            fi
          done
          
          # 2. Build agbcc explicitly
          cd agbcc
          chmod -R +x .
          ./build.sh
          mkdir -p bin
          cp agbcc bin/agbcc
          cd ../..

      - name: Build ROM
        run: |
          # 3. Ensure binaries are in the path for the final build
          export PATH=$(pwd)/tools/agbcc/bin:$(pwd)/tools/gbagfx:$(pwd)/tools/preproc:$(pwd)/tools/scaninc:$(pwd)/tools/ramscrgen:$PATH
          
          # 4. Run the main build
          # We use the explicit path for agbcc and ensure the build directory exists
          mkdir -p build/emerald
          make -j$(nproc) CC=$(pwd)/tools/agbcc/bin/agbcc

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CrystalDust-ROM
          path: '*.gba'
