name: CrystalDust Build

on:
  push:
    branches: [ progress ]
  pull_request:
    branches: [ progress ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-9 g++-9 gcc-arm-none-eabi binutils-arm-none-eabi libpng-dev make git

      - name: Build Toolchain
        run: |
          cd tools/agbcc
          chmod -R +x .
          
          # Define the ARM Cross-Compiler Tools
          export CROSS=arm-none-eabi-
          export CC_TARGET=${CROSS}gcc
          export AS_TARGET=${CROSS}as
          export AR_TARGET=${CROSS}ar
          
          # Build agbcc itself (Host build)
          export CC=gcc-9
          export CXX=g++-9
          export CFLAGS="-std=gnu89 -w -fno-strict-aliasing -fno-builtin -Wno-format-security -Wno-error=implicit-function-declaration -fcommon"
          ./build.sh
          
          # Force the use of Target tools for the libraries
          # We pass variables directly to make to override any internal defaults
          [ -d "libc" ] && cd libc && make CC=$CC_TARGET AS=$AS_TARGET AR=$AR_TARGET CFLAGS="$CFLAGS" && cd ..
          [ -d "libgcc" ] && cd libgcc && make CC=$CC_TARGET AS=$AS_TARGET AR=$AR_TARGET CFLAGS="$CFLAGS" && cd ..
          cd ../..
          
          # Build other tools using standard host compiler
          find tools -mindepth 2 -name "Makefile" -exec dirname {} \; | while read dir; do
            if [ "$dir" != "tools/agbcc" ]; then
              make -C "$dir" CFLAGS="-std=gnu11 -O2 -Wall"
            fi
          done

      - name: Build ROM
        run: |
          export PATH=$(pwd)/tools/agbcc/bin:$PATH
          export AGBCC=$(pwd)/tools/agbcc/bin/agbcc
          make -j$(nproc)

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CrystalDust-ROM
          path: '*.gba'
