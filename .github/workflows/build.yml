name: CrystalDust Build

on:
  push:
    branches:
      - progress

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive # CRITICAL: This pulls in libagbsyscall

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils-arm-none-eabi gcc-arm-none-eabi libpng-dev make git

      - name: Build Toolchain
        run: |
          # Build agbcc
          cd tools/agbcc
          chmod -R +x .
          ./build.sh
          [ -d "libc" ] && cd libc && make && cd ..
          [ -d "libgcc" ] && cd libgcc && make && cd ..
          cd ../..
          
          # Build individual utilities
          find tools -maxdepth 2 -name "Makefile" -exec dirname {} \; | while read dir; do
            make -C "$dir"
          done

      - name: Build ROM
        run: |
          # Ensure build directory structure
          mkdir -p build/emerald
          
          # Add local agbcc to PATH
          export PATH=$(pwd)/tools/agbcc/bin:$PATH
          
          # Force the compiler to use GBA-compatible system headers
          # This resolves the missing <stddef.h> and <string.h> errors
          export CFLAGS="-I$(arm-none-eabi-gcc -print-file-name=include)"
          
          # Run the main build
          make -j$(nproc)

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CrystalDust-ROM
          path: '*.gba'
