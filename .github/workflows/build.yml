name: Build ROM

on:
  push:
    branches:
      - progress
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Git config
        run: git config --global core.symlinks false

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: progress

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential binutils-arm-none-eabi gcc-arm-none-eabi libpng-dev libc6-dev

      - name: Build tools
        run: |
          rm -rf tools/agbcc
          git clone https://github.com/pret/agbcc tools/agbcc
          cd tools/agbcc && ./build.sh && mkdir -p bin && cp agbcc bin/ && cd ../..
          for tool in scaninc preproc ramscrgen gbagfx gbafix; do
              make -C tools/$tool
              mkdir -p tools/$tool
              cp tools/$tool/$tool tools/$tool/ || true
          done

      - name: Build ROM
        run: |
          mkdir -p build/src build/data
          
          # Create minimal dummy headers in the agbcc include path
          # These satisfy the compiler's search for standard headers without pulling in system-conflicting code
          echo "#define NULL ((void*)0)" > tools/agbcc/include/stddef.h
          echo "typedef unsigned char uint8_t; typedef unsigned short uint16_t; typedef unsigned int uint32_t; typedef signed char int8_t; typedef signed short int16_t; typedef signed int int32_t;" > tools/agbcc/include/stdint.h
          
          export AGBSPECIFIC_INC=$(pwd)/tools/agbcc/include
          export PATH=$(pwd)/tools/agbcc/bin:$(pwd)/tools/preproc:$(pwd)/tools/scaninc:$PATH
          
          # Build:
          # -Iinclude is placed first so project headers take precedence over everything else.
          # -nostdinc keeps the environment isolated for agbcc.
          make TOOLCHAIN_PREFIX=arm-none-eabi- \
               MKDIR="mkdir -p" \
               CC="agbcc -nostdinc -Iinclude -I$AGBSPECIFIC_INC" \
               CPP="arm-none-eabi-cpp -Iinclude" \
               MODERNCC="gcc" \
               AS=arm-none-eabi-as \
               AR=arm-none-eabi-ar \
               LD=arm-none-eabi-ld \
               OBJCOPY=arm-none-eabi-objcopy

      - name: Upload ROM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: crystal-dust-rom
          path: "*.gba"
