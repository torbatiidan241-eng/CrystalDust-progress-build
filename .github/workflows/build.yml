name: Build ROM

on:
  push:
    branches:
      - progress
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Git config
        run: git config --global core.symlinks false

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: progress

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential binutils-arm-none-eabi gcc-arm-none-eabi libpng-dev libc6-dev

      - name: Build tools
        run: |
          rm -rf tools/agbcc
          git clone https://github.com/pret/agbcc tools/agbcc
          cd tools/agbcc && ./build.sh && mkdir -p bin && cp agbcc bin/ && cd ../..
          for tool in scaninc preproc ramscrgen gbagfx gbafix; do
              make -C tools/$tool
              mkdir -p tools/$tool
              cp tools/$tool/$tool tools/$tool/ || true
          done

      - name: Build ROM
        run: |
          mkdir -p build/src build/data
          mkdir -p include/dummy
          echo "typedef unsigned int size_t; typedef int ptrdiff_t;" > include/dummy/stddef.h
          
          # Set absolute path for the dummy header
          DUMMY_PATH=$(pwd)/include/dummy
          
          # Define the cross-compiler configuration
          CROSS_COMPILE_FLAGS="-nostdinc -ffreestanding -I$DUMMY_PATH -Iinclude -include include/gba/gba.h"
          
          # Export variables globally
          export CC="arm-none-eabi-gcc $CROSS_COMPILE_FLAGS"
          export CPP="arm-none-eabi-cpp $CROSS_COMPILE_FLAGS"
          export MODERNCC="arm-none-eabi-gcc $CROSS_COMPILE_FLAGS"
          export PATH=$(pwd)/tools/agbcc/bin:$(pwd)/tools/preproc:$(pwd)/tools/scaninc:$PATH
          
          # Build with all variable overrides
          make TOOLCHAIN_PREFIX=arm-none-eabi- \
               MKDIR="mkdir -p" \
               CC="$CC" \
               CPP="$CPP" \
               MODERNCC="$MODERNCC" \
               AS=arm-none-eabi-as \
               AR=arm-none-eabi-ar \
               LD=arm-none-eabi-ld \
               OBJCOPY=arm-none-eabi-objcopy

      - name: Upload ROM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: crystal-dust-rom
          path: "*.gba"
