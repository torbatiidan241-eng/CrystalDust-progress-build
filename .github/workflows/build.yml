name: CrystalDust Build

on:
  push:
    branches:
      - progress

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils-arm-none-eabi gcc-arm-none-eabi libpng-dev make git

      - name: Build Toolchain
        run: |
          # 1. Build agbcc with explicit path creation
          cd tools/agbcc
          chmod -R +x .
          ./build.sh
          # Build libs
          [ -d "libc" ] && cd libc && make && cd ..
          [ -d "libgcc" ] && cd libgcc && make && cd ..
          cd ../..
          # Ensure bin exists and move binary
          mkdir -p tools/agbcc/bin
          cp tools/agbcc/gcc/agbcc tools/agbcc/bin/agbcc
          cp tools/agbcc/gcc/xgcc tools/agbcc/bin/xgcc

      - name: Build Utilities
        run: |
          # Build all tools (ramscrgen, gbagfx, etc.)
          for dir in tools/*/; do
            if [ -f "${dir}Makefile" ]; then
              make -C "$dir"
            fi
          done

      - name: Build ROM
        run: |
          mkdir -p build/emerald
          # Export path to local agbcc
          export PATH=$(pwd)/tools/agbcc/bin:$PATH
          
          # Tell make exactly where to find the system headers for the cross-compiler
          # This fixes the <string.h> and <stddef.h> missing errors
          export GCC_LIB=$(arm-none-eabi-gcc -print-libgcc-file-name | xargs dirname)
          export INC_PATH=$(arm-none-eabi-gcc -print-file-name=include)
          
          # Run make with forced include paths
          make CFLAGS="-I$INC_PATH" -j$(nproc)

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CrystalDust-ROM
          path: '*.gba'
