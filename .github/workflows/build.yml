name: CrystalDust Build

on:
  push:
    branches:
      - progress

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils-arm-none-eabi gcc-arm-none-eabi libpng-dev make git

      - name: Build agbcc
        run: |
          # 1. Build the core gcc component
          cd tools/agbcc/gcc
          chmod +x build.sh
          ./build.sh
          cd ..
          
          # 2. Build libc
          cd libc
          make
          cd ..
          
          # 3. Build libgcc
          cd libgcc
          make
          cd ..
          
          # 4. Finalize bin directory for the ROM Makefile
          mkdir -p bin
          if [ -f "gcc/agbcc" ]; then
            cp gcc/agbcc bin/agbcc
            cp gcc/xgcc bin/xgcc
            echo "Compiler successfully built and moved to tools/agbcc/bin"
          else
            echo "::error::agbcc binary not found in gcc/ directory."
            exit 1
          fi
          cd ../..

      - name: Build ROM
        run: |
          # Force the use of the newly built toolchain and cross-compiler flags
          export PATH=$PATH:$(pwd)/tools/agbcc/bin
          make CC=arm-none-eabi-gcc AR=arm-none-eabi-ar LD=arm-none-eabi-ld OBJCOPY=arm-none-eabi-objcopy -j$(nproc)

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CrystalDust-ROM
          path: '*.gba'
# Triggering a new build
