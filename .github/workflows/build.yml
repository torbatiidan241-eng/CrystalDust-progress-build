name: CrystalDust Build

on:
  push:
    branches: [ progress ]
  pull_request:
    branches: [ progress ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Install Dependencies
        run: |
          sudo apt-get update
          # flex and bison are required to generate the missing source files
          # lib32gcc-s1 is often required for legacy 32-bit compiler support
          sudo apt-get install -y gcc-9 g++-9 gcc-arm-none-eabi binutils-arm-none-eabi libpng-dev make git flex bison

      - name: Build Toolchain
        run: |
          cd tools/agbcc
          # Ensure all scripts are executable
          chmod +x build.sh
          
          # The build.sh script usually performs the necessary configuration
          ./build.sh
          
          # Verify the binary exists
          if [ ! -f "agbcc" ]; then
            echo "Error: agbcc binary was not created."
            exit 1
          fi
          
          # Move to the project root
          cd ../..

      - name: Build ROM
        run: |
          # Ensure the compiler is in the path
          export PATH=$(pwd)/tools/agbcc:$PATH
          export AGBCC=$(pwd)/tools/agbcc/agbcc
          
          # Run the build
          make -j$(nproc)

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CrystalDust-ROM
          path: '*.gba'
