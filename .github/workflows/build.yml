name: Build ROM

on:
  push:
    branches:
      - progress
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Git config
        run: git config --global core.symlinks false

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: progress

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential binutils-arm-none-eabi gcc-arm-none-eabi libpng-dev libc6-dev

      - name: Build tools
        run: |
          rm -rf tools/agbcc
          git clone https://github.com/pret/agbcc tools/agbcc
          chmod -R +x tools/agbcc

      - name: Build ROM
        run: |
          # Create build directories explicitly to prevent mkdir errors
          mkdir -p build/src build/data
          
          # Build using explicit ARM toolchain variables to override default CC
          make CC=arm-none-eabi-gcc AR=arm-none-eabi-ar AS=arm-none-eabi-as OBJCOPY=arm-none-eabi-objcopy AGT_PATH=$(pwd)/tools/agbcc

      - name: Upload ROM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: crystal-dust-rom
          path: "*.gba"
