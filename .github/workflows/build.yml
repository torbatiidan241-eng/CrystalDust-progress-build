name: CrystalDust Build

on: [push]

jobs:
  build:
    runs-on: ubuntu-20.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libpng-dev gcc-arm-none-eabi

      - name: Build Compiler (agbcc)
        run: |
          cd tools/agbcc
          # Ensure scripts have execute permissions
          chmod +x build.sh
          ./build.sh
          # Prepare the binary for the build process
          mkdir -p bin
          cp agbcc bin/agbcc
          cd ../..

      - name: Build Game
        run: |
          # Add the local toolchain to PATH
          export PATH=$PATH:$(pwd)/tools/agbcc/bin
          # Run the build
          make -j$(nproc)

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CrystalDust-ROM
          path: '*.gba'
