name: CrystalDust Build

on:
  push:
    branches: [ progress ]
  pull_request:
    branches: [ progress ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-9 g++-9 gcc-arm-none-eabi binutils-arm-none-eabi libpng-dev make git

      - name: Build Toolchain
        run: |
          cd tools/agbcc
          chmod -R +x .
          ./build.sh
          # Build the libagbsyscall.s dependency manually if missing
          # This often happens when the build system is interrupted
          cd ../..

      - name: Build ROM
        run: |
          # 1. Define the absolute paths
          export TOOLCHAIN_PATH=$(pwd)/tools/agbcc
          export PATH=$TOOLCHAIN_PATH:$TOOLCHAIN_PATH/bin:$PATH
          export AGBCC=$TOOLCHAIN_PATH/bin/agbcc
          
          # 2. Force the Makefile to use the correct compiler
          # We pass these variables directly into the make command
          # We also pre-create the build directory to avoid the 'cd build' error
          mkdir -p build/emerald
          
          make -j$(nproc) CC=$AGBCC CPP=$AGBCC AS=arm-none-eabi-as AR=arm-none-eabi-ar

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CrystalDust-ROM
          path: '*.gba'
