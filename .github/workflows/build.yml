name: Build
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Configure Git
        run: |
          git config --global core.symlinks false
          git config --global core.longpaths true

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Dependencies
        run: |
          sudo apt-get update
          # Added 'make' to the list of packages to install
          sudo apt-get install -y build-essential libpng-dev gcc-arm-none-eabi make

      - name: Build Tools
        run: make tools

      - name: Build ROM
        run: make
        env:
          PATH: .:$PATH

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: crystal-dust-rom
          path: '*.gba'
