name: Build ROM

on:
  push:
    branches:
      - progress
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: progress

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential binutils-arm-none-eabi gcc-arm-none-eabi libpng-dev libc6-dev

      - name: Build tools
        run: |
          # Manually build tools and ensure they are in the PATH
          git clone https://github.com/pret/agbcc tools/agbcc
          cd tools/agbcc && ./build.sh && cd ../..
          chmod -R +x tools/agbcc

      - name: Patch Makefile
        run: |
          # This removes the line that forces tool building to prevent the 'mkdir' and 'stddef' errors
          sed -i '/make_tools.mk/d' Makefile

      - name: Build ROM
        run: |
          # Use explicit ARM compiler paths
          export PATH=$(pwd)/tools/agbcc:$PATH
          make CC=arm-none-eabi-gcc CPP=arm-none-eabi-cpp AS=arm-none-eabi-as AR=arm-none-eabi-ar LD=arm-none-eabi-ld OBJCOPY=arm-none-eabi-objcopy

      - name: Upload ROM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: crystal-dust-rom
          path: "*.gba"
