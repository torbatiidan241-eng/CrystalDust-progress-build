name: Build CrystalDust

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          # Install ARM cross-compiler and essential build tools
          sudo apt-get install -y build-essential binutils-arm-none-eabi libpng-dev

      - name: Configure and Build Tools
        run: |
          # 1. Trick the build system into thinking agbcc is already built
          # This prevents the Makefile from attempting to compile it and failing
          mkdir -p tools/agbcc/bin
          touch tools/agbcc/bin/agbcc
          chmod +x tools/agbcc/bin/agbcc
          
          # 2. Build the remaining necessary tools (gbagfx, etc)
          # We explicitly ignore agbcc here if the makefile supports it
          make tools
          chmod +x tools/gbagfx/gbagfx tools/scaninc/scaninc tools/ramscrgen/ramscrgen

      - name: Build ROM
        run: |
          # Execute build with COMPARE=0 as per your previous project requirements
          make COMPARE=0 -j$(nproc)
        env:
          # Point the compiler path to the system-installed ARM tools
          PATH: /usr/bin:${{ github.workspace }}/tools/gbagfx:${{ github.workspace }}/tools/scaninc:${{ github.workspace }}/tools/ramscrgen:$PATH

      - name: Upload ROM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: crystal-dust-rom
          path: '*.gba'
