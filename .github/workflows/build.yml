name: Build CrystalDust

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Configure Git
        run: |
          git config --global core.symlinks false
          git config --global core.longpaths true

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          ref: progress

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential binutils-arm-none-eabi libpng-dev

      - name: Pre-Build Fixes
        run: |
          # Create directories the Makefile expects to 'clean'
          # This prevents the 'mkdir: missing operand' and 'rm' errors
          mkdir -p build/emerald build/modern
          
          # Initialize submodules explicitly
          git submodule update --init --recursive
          
          # Bypass agbcc build by providing a dummy
          mkdir -p tools/agbcc/bin
          touch tools/agbcc/bin/agbcc
          chmod +x tools/agbcc/bin/agbcc

      - name: Build ROM
        run: |
          # Use a 'safe' clean that doesn't crash on missing files
          # We manually clean the build dir to avoid the Makefile's buggy 'tidy' target
          rm -rf build/*
          
          # Build with COMPARE=0
          make COMPARE=0 -j$(nproc)
        env:
          PATH: /usr/bin:${{ github.workspace }}/tools/gbagfx:${{ github.workspace }}/tools/scaninc:${{ github.workspace }}/tools/ramscrgen:$PATH

      - name: Upload ROM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: crystal-dust-rom
          path: '*.gba'
