name: Build CrystalDust

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Configure Git
        run: |
          git config --global core.symlinks false
          git config --global core.longpaths true

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          ref: progress

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential binutils-arm-none-eabi libpng-dev

      - name: Initialize Build Environment
        run: |
          # Ensure submodules are fully hydrated
          git submodule update --init --recursive
          
          # Create necessary build directories
          mkdir -p build
          mkdir -p build/src
          
          # Create dummy agbcc to bypass the compiler build error
          # Modern toolchains use arm-none-eabi-gcc which is already installed
          mkdir -p tools/agbcc/bin
          touch tools/agbcc/bin/agbcc
          chmod +x tools/agbcc/bin/agbcc

      - name: Build Tools
        run: |
          make tools
          chmod +x tools/gbagfx/gbagfx tools/scaninc/scaninc tools/ramscrgen/ramscrgen

      - name: Build ROM
        run: |
          # Clean build state
          make clean
          # Run build using the progress branch target
          # COMPARE=0 skips the base ROM binary comparison
          make COMPARE=0 -j$(nproc)
        env:
          PATH: /usr/bin:${{ github.workspace }}/tools/gbagfx:${{ github.workspace }}/tools/scaninc:${{ github.workspace }}/tools/ramscrgen:$PATH

      - name: Upload ROM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: crystal-dust-rom
          path: '*.gba'
