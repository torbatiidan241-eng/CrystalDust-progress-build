name: Build CrystalDust

on:
  push:
    branches: [ "progrees" ]
  pull_request:
    branches: [ "progrees" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Configure Git Settings
        run: |
          git config --global core.symlinks false
          git config --global core.longpaths true

      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Host Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libpng-dev pkg-config git curl bzip2 automake autoconf libtool golang-go

      - name: Download and Setup ARM GCC 6
        run: |
          curl -L -o gcc-arm-none-eabi.tar.bz2 https://developer.arm.com/-/media/Files/downloads/gnu-rm/6-2017q2/gcc-arm-none-eabi-6-2017-q2-update-linux.tar.bz2
          tar -xf gcc-arm-none-eabi.tar.bz2
          echo "$PWD/gcc-arm-none-eabi-6-2017-q2-update/bin" >> $GITHUB_PATH

      - name: Clone and Build agbcc
        run: |
          if [ ! -d "agbcc" ] && [ ! -d "tools/agbcc" ]; then
            git clone https://github.com/pret/agbcc.git agbcc
          fi
          
          if [ -d "agbcc" ]; then
            cd agbcc
            ./build.sh
            ./install.sh ..
            cd ..
          elif [ -d "tools/agbcc" ]; then
            cd tools/agbcc
            ./build.sh
            ./install.sh ../..
            cd ../..
          fi

      - name: Build Repository Tools & Poryscript
        run: |
          make tools
          
          # Clone poryscript source externally and build it so we don't wipe out command_config.json
          git clone https://github.com/huderlem/poryscript.git /tmp/poryscript-src
          cd /tmp/poryscript-src
          go build -o poryscript
          
          # Place the compiled binary right next to command_config.json in tools/poryscript/
          cp poryscript $GITHUB_WORKSPACE/tools/poryscript/
          cd $GITHUB_WORKSPACE

      - name: Build ROM
        run: |
          make

      - name: Upload ROM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CrystalDust-ROM
          path: |
            *.gba
            build/**/*.gba
