name: CrystalDust Build

on:
  push:
    branches:
      - progress

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Initialize Submodules
        run: |
          # This ensures the 'libagbsyscall' and other dependencies are fully pulled
          git submodule sync --recursive
          git submodule update --init --recursive

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils-arm-none-eabi gcc-arm-none-eabi libpng-dev make git

      - name: Build Toolchain
        run: |
          cd tools/agbcc
          chmod -R +x .
          ./build.sh
          # Add the -Wno-implicit-function-declaration flag to force the build
          # even if modern GCC complains about missing headers like <string.h>
          export CFLAGS="-Wno-implicit-function-declaration -Wno-int-conversion"
          [ -d "libc" ] && cd libc && make CFLAGS="$CFLAGS" && cd ..
          [ -d "libgcc" ] && cd libgcc && make CFLAGS="$CFLAGS" && cd ..
          
          # If the main agbcc Makefile also fails, use the same flag
          make CFLAGS="$CFLAGS" || true
          cd ../..

      - name: Build ROM
        run: |
          # Create workspace
          mkdir -p build/emerald
          
          # Add the local agbcc to PATH
          export PATH=$(pwd)/tools/agbcc/bin:$PATH
          
          # Point the compiler to the correct GBA headers
          # This resolves the 'fatal error: stddef.h: No such file or directory'
          export CFLAGS="-I$(pwd)/tools/agbcc/include"
          
          # Build the main project using all available CPU cores
          make -j$(nproc)

      - name: Upload ROM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CrystalDust-ROM
          path: '*.gba'
