name: Build CrystalDust

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Manual Checkout
        run: |
          git init
          git config core.sparseCheckout true
          echo "/*" > .git/info/sparse-checkout
          echo "!/tools/agbcc" >> .git/info/sparse-checkout
          git remote add origin https://github.com/${{ github.repository }}
          git fetch --depth 1 origin progress
          git checkout progress

      - name: Prepare Environment
        run: |
          mkdir -p build/src
          mkdir -p tools/agbcc/bin
          touch tools/agbcc/bin/agbcc
          chmod +x tools/agbcc/bin/agbcc

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-arm-none-eabi libpng-dev

      - name: Build ROM
        run: |
          # 1. Define paths
          ARM_INC=$(arm-none-eabi-gcc -print-file-name=include)
          
          # 2. Create the missing build directories to prevent 'mkdir' errors
          mkdir -p build/emerald/src
          mkdir -p build/src
          
          # 3. Build only the 'rom' target. 
          # This specifically bypasses 'berry_fix' and 'payload'
          # We use 'make rom' to trigger only the main compilation
          make rom \
               COMPARE=0 \
               CC=arm-none-eabi-gcc \
               AS=arm-none-eabi-as \
               LD=arm-none-eabi-ld \
               CFLAGS="-I$ARM_INC -DARM_ASM -ffreestanding" \
               -j$(nproc)
        env:
          PATH: /usr/bin:${{ github.workspace }}/tools/gbagfx:${{ github.workspace }}/tools/scaninc:${{ github.workspace }}/tools/ramscrgen:$PATH
      - name: Upload ROM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: crystal-dust-rom
          path: '*.gba'
