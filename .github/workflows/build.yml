name: CrystalDust Build

on:
  push:
    branches:
      - progress

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y build-essential libpng-dev pkg-config

      - name: Build agbcc
        run: |
          cd tools/agbcc
          ./build.sh
          # Ensure binary is in the location the Makefile expects
          mkdir -p bin
          if [ -f "agbcc" ]; then cp agbcc bin/agbcc; fi
          if [ -f "gcc/agbcc" ]; then cp gcc/agbcc bin/agbcc; fi
          cd ../..

      - name: Build ROM
        run: |
          # Do NOT force CC=... Let the Makefile handle it.
          make -j$(nproc)

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CrystalDust-ROM
          path: '*.gba'
