name: CrystalDust Build

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libpng-dev

      - name: Build All Tools
        run: |
          # Build tools individually to ensure no 'missing directory' errors
          make -C tools/gbagfx
          make -C tools/scaninc
          make -C tools/ramscrgen
          # Add any other tools needed by your Makefile here

      - name: Build ROM
        run: |
          make -j$(nproc)

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CrystalDust-ROM
          path: '*.gba'
