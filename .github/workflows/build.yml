name: CrystalDust Build

on:
  push:
    branches:
      - progress

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Initialize Submodules
        run: |
          # Crucial: This pulls the 'libagbsyscall' folder and other dependencies
          git submodule sync --recursive
          git submodule update --init --recursive

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils-arm-none-eabi gcc-arm-none-eabi libpng-dev make git

      - name: Build Toolchain and Dependencies
        run: |
          # 1. Build the GBA-specific compiler (agbcc)
          cd tools/agbcc
          chmod -R +x .
          ./build.sh
          # Build necessary libraries
          [ -d "libc" ] && cd libc && make && cd ..
          [ -d "libgcc" ] && cd libgcc && make && cd ..
          cd ../..
          
          # 2. Build project utilities recursively
          find tools -maxdepth 2 -name "Makefile" -exec dirname {} \; | while read dir; do
            echo "Building tool in $dir..."
            make -C "$dir"
          done

      - name: Build ROM
        run: |
          # Setup workspace
          mkdir -p build/emerald
          
          # Add local agbcc to path so the build system finds it
          export PATH=$(pwd)/tools/agbcc/bin:$PATH
          
          # Tell the compiler exactly where to find the GBA-specific include headers
          # This fixes the <stddef.h> and <string.h> missing errors
          export CFLAGS="-I$(pwd)/tools/agbcc/include"
          
          # Build the main project
          # Use -j$(nproc) to speed up compilation using all available cores
          make -j$(nproc)

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CrystalDust-ROM
          path: '*.gba'
