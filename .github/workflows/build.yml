name: CrystalDust Build

on:
  push:
    branches: [ progress ]
  pull_request:
    branches: [ progress ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-9 g++-9 gcc-arm-none-eabi binutils-arm-none-eabi libpng-dev make git

      - name: Build Toolchain
        run: |
          cd tools/agbcc
          chmod -R +x .
          
          # 1. Build the agbcc compiler itself (Host-machine build)
          export CC=gcc-9
          export CXX=g++-9
          export CFLAGS="-std=gnu89 -w -fno-strict-aliasing -fno-builtin -Wno-format-security -Wno-error=implicit-function-declaration -fcommon"
          ./build.sh
          
          # 2. Build the runtime libraries (Target-machine build)
          # We must use arm-none-eabi tools here, NOT host gcc
          export TARGET_CC=arm-none-eabi-gcc
          export TARGET_AS=arm-none-eabi-as
          export TARGET_AR=arm-none-eabi-ar
          
          [ -d "libc" ] && cd libc && make CC=$TARGET_CC AS=$TARGET_AS AR=$TARGET_AR CFLAGS="$CFLAGS" && cd ..
          [ -d "libgcc" ] && cd libgcc && make CC=$TARGET_CC AS=$TARGET_AS AR=$TARGET_AR CFLAGS="$CFLAGS" && cd ..
          cd ../..
          
          # 3. Build other tools
          find tools -mindepth 2 -name "Makefile" -exec dirname {} \; | while read dir; do
            if [ "$dir" != "tools/agbcc" ]; then
              make -C "$dir" CFLAGS="-std=gnu11 -O2 -Wall"
            fi
          done

      - name: Build ROM
        run: |
          export PATH=$(pwd)/tools/agbcc/bin:$PATH
          export AGBCC=$(pwd)/tools/agbcc/bin/agbcc
          make -j$(nproc)

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CrystalDust-ROM
          path: '*.gba'
