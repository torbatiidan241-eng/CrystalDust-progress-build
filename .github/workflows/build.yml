name: Build ROM

on:
  push:
    branches:
      - progress
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Git config
        run: git config --global core.symlinks false

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: progress

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential binutils-arm-none-eabi gcc-arm-none-eabi libpng-dev libc6-dev

      - name: Build tools
        run: |
          rm -rf tools/agbcc
          git clone https://github.com/pret/agbcc tools/agbcc
          cd tools/agbcc && ./build.sh && mkdir -p bin && cp agbcc bin/ && cd ../..
          for tool in scaninc preproc ramscrgen gbagfx gbafix; do
              make -C tools/$tool
              mkdir -p tools/$tool
              cp tools/$tool/$tool tools/$tool/ || true
          done

      - name: Build ROM
        run: |
          mkdir -p build/src build/data
          mkdir -p include/dummy
          
          # Only define NULL; let the project's types.h handle all integer types
          echo "#define NULL ((void*)0)" > include/dummy/stddef.h
          # Create an empty stdint.h to satisfy the #include <stdint.h> call
          touch include/dummy/stdint.h
          
          DUMMY_PATH=$(pwd)/include/dummy
          ROM_FLAGS="-nostdinc -ffreestanding -I$DUMMY_PATH -Iinclude -include include/gba/gba.h"
          
          export PATH=$(pwd)/tools/agbcc/bin:$(pwd)/tools/preproc:$(pwd)/tools/scaninc:$PATH
          
          make TOOLCHAIN_PREFIX=arm-none-eabi- \
               MKDIR="mkdir -p" \
               CC="arm-none-eabi-gcc $ROM_FLAGS" \
               CPP="arm-none-eabi-cpp $ROM_FLAGS" \
               MODERNCC="gcc" \
               AS=arm-none-eabi-as \
               AR=arm-none-eabi-ar \
               LD=arm-none-eabi-ld \
               OBJCOPY=arm-none-eabi-objcopy

      - name: Upload ROM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: crystal-dust-rom
          path: "*.gba"
