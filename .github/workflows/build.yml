name: CrystalDust Build

on:
  push:
    branches: [ progress ]
  pull_request:
    branches: [ progress ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-9 g++-9 gcc-arm-none-eabi binutils-arm-none-eabi libpng-dev make git

      - name: Build Toolchain
        run: |
          cd tools/agbcc
          chmod -R +x .
          
          # 1. Build agbcc (Native Host Tool)
          export CC=/usr/bin/gcc-9
          export CXX=/usr/bin/g++-9
          export CFLAGS="-std=gnu89 -w -fno-strict-aliasing -fno-builtin -Wno-format-security -fcommon"
          ./build.sh
          
          # 2. Build Libraries (Target ARM)
          # Patching strategy: Instead of hijacking the assembler, we clean the source code.
          # This allows us to use standard 'arm-none-eabi-as'.
          
          # We manually intervene in the library build to patch the assembly source
          cd libgcc
          # Edit the Makefile to include the patching step for libgcc1.S
          # This inserts our sed commands into the build process
          sed -i '/cp \.\/config\/arm\/lib1funcs\.asm libgcc1\.S/a \
          sed -i "s/@/; /g" libgcc1.S \
          sed -i "s/\\\.req/ .equ/g" libgcc1.S' Makefile
          
          # Now run the build
          make -j$(nproc) AS=arm-none-eabi-as CFLAGS="-mcpu=arm7tdmi -mthumb-interwork"
          cd ..
          
          # Build libc similarly
          [ -d "libc" ] && cd libc && make -j$(nproc) AS=arm-none-eabi-as CFLAGS="-mcpu=arm7tdmi -mthumb-interwork" && cd ..
          cd ../..
          
          # 3. Build Host Utilities (preproc, etc.)
          # Standard native build as these tools are for the host, not the GBA
          find tools -mindepth 2 -name "Makefile" -exec dirname {} \; | while read dir; do
            if [ "$dir" != "tools/agbcc" ]; then
              make -C "$dir" CC=/usr/bin/gcc CXX=/usr/bin/g++ AS=/usr/bin/as AR=/usr/bin/ar CFLAGS="-std=gnu11 -O2 -Wall"
            fi
          done

      - name: Build ROM
        run: |
          export PATH=$(pwd)/tools/agbcc/bin:$PATH
          export AGBCC=$(pwd)/tools/agbcc/bin/agbcc
          make -j$(nproc)

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CrystalDust-ROM
          path: '*.gba'
